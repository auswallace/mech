<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin-turbo V8 in a performance SUV</title>
<style>
:root{--m-paper:#121212;--m-ink:#e8e8e8;--m-muted:#8a8a8a;--m-card:#161616;--m-rule:#2a2a2a;--m-lit:#fff;--m-mid:#6a6a6a}
[data-theme=light]{--m-paper:#f7f7f5;--m-ink:#1a1a1a;--m-muted:#6b6b70;--m-card:#fff;--m-rule:#e2e2e0;--m-lit:#000;--m-mid:#9a9a9f}
body{margin:0;background:var(--m-paper);color:var(--m-ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.mech{max-width:680px;margin:28px auto;background:var(--m-card);border:1px solid var(--m-rule);border-radius:12px;padding:14px 16px 12px}
.mech-head,.mech-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--m-muted)}
.mech-head b{color:var(--m-ink);font-weight:500}
.mech-stage{outline:none;cursor:grab;margin:6px 0;border-radius:8px}
.mech-stage:active{cursor:grabbing}.mech-stage:focus-visible{box-shadow:0 0 0 2px var(--m-muted)}
.mech-stage canvas{display:block;width:100%;height:auto}
.mech-foot code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--m-ink)}
.mech-keys{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 4px;font-size:12px;color:var(--m-muted)}
.mech-keys span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--m-mid)}
.mech-keys .k-lit::before{background:var(--m-lit)}
.mech-cap{font-size:13px;color:var(--m-muted);margin:6px 0 0}
.mech-controls{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:2px 0 8px;font-size:12px;color:var(--m-muted)}
.mech-controls button{font:inherit;color:var(--m-ink);background:transparent;border:1px solid var(--m-rule);border-radius:7px;padding:5px 10px;cursor:pointer}
.mech-controls button[aria-pressed=true]{background:var(--m-ink);color:var(--m-card);border-color:var(--m-ink)}
.mech-controls input[type=range]{flex:1;min-width:120px;accent-color:var(--m-ink)}
.mech-controls .sp{flex-basis:100%;height:0}</style>
</head>
<body>
<div id="fig"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* mech: isometric technical figures on a real 3D core.
   World: x right, y toward the viewer, z up. Units are millimetres of the real thing, or whatever you like.
   Uses the global THREE (r128). Everything else is here. */
(function (global) {
  const T = global.THREE;
  const THEMES = {
    dark: { paper: 0x121212, face: 0x1b1b1b, hi: 0x565656, mid: 0x3c3c3c, lo: 0x282828, lit: 0xededed, edge: 0xd8d8d8, edgeLo: 0x7a7a7a, shadow: 0.6, ambient: 0.42 },
    light: { paper: 0xf7f7f5, face: 0xffffff, hi: 0xcfcdc7, mid: 0xa5a39e, lo: 0x6c6b68, lit: 0x232326, edge: 0x2a2a2e, edgeLo: 0x77777c, shadow: 0.2, ambient: 0.3 },
  };
  const GRADIENT = [0.5, 0.68, 0.85, 1.0];

  function gradientMap() {
    const data = new Uint8Array(GRADIENT.map((v) => Math.round(v * 255)));
    const tex = new T.DataTexture(data, GRADIENT.length, 1, T.LuminanceFormat);
    tex.minFilter = tex.magFilter = T.NearestFilter;
    tex.needsUpdate = true;
    return tex;
  }

  // ---------- geometry helpers ----------
  function roundedRect(w, d, r) {
    r = Math.min(r, w / 2, d / 2);
    const s = new T.Shape();
    s.moveTo(-w / 2 + r, -d / 2);
    s.lineTo(w / 2 - r, -d / 2); s.absarc(w / 2 - r, -d / 2 + r, r, -Math.PI / 2, 0, false);
    s.lineTo(w / 2, d / 2 - r); s.absarc(w / 2 - r, d / 2 - r, r, 0, Math.PI / 2, false);
    s.lineTo(-w / 2 + r, d / 2); s.absarc(-w / 2 + r, d / 2 - r, r, Math.PI / 2, Math.PI, false);
    s.lineTo(-w / 2, -d / 2 + r); s.absarc(-w / 2 + r, -d / 2 + r, r, Math.PI, Math.PI * 1.5, false);
    return s;
  }
  // A rounded box standing on z=0, centred at origin in x,y. bevel adds a small chamfer on the top edge.
  function boxGeo({ w = 10, d = 10, h = 10, r = 0, bevel = 0, segments = 4 }) {
    const shape = roundedRect(w, d, r);
    const g = new T.ExtrudeGeometry(shape, { depth: h, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: segments });
    if (bevel > 0) g.translate(0, 0, bevel); // keep base on z=0 after the bevel
    g.computeVertexNormals();
    return g;
  }
  function cylGeo({ r = 5, h = 10, n = 32, axis = "z" }) {
    const g = new T.CylinderGeometry(r, r, h, n, 1, false);
    // CylinderGeometry is along y, centred. Rotate so it stands on z=0 (or lies along x / y).
    if (axis === "z") { g.rotateX(Math.PI / 2); g.translate(0, 0, h / 2); }
    else if (axis === "y") { g.translate(0, h / 2, 0); }
    else if (axis === "x") { g.rotateZ(-Math.PI / 2); g.translate(h / 2, 0, 0); }
    return g;
  }
  function tubeGeo(points, r = 1, { n = 10, bend = 2, closed = false } = {}) {
    const v = points.map((p) => new T.Vector3(p[0], p[1], p[2]));
    const curve = new T.CatmullRomCurve3(v, closed, "centripetal", 0.5);
    return new T.TubeGeometry(curve, Math.max(8, points.length * 12 * bend), r, n, closed);
  }
  // A side profile in the x-z plane, extruded across y. points: [x,z] or { arc:[cx,cz,r,a0,a1,clockwise] }.
  function profileGeo(points, depth, yCenter = 0) {
    const s = new T.Shape(); let first = true;
    for (const p of points) { if (p.arc) s.absarc(...p.arc); else if (first) { s.moveTo(p[0], p[1]); first = false; } else s.lineTo(p[0], p[1]); }
    const g = new T.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 20 });
    g.rotateX(Math.PI / 2); g.translate(0, yCenter + depth / 2, 0);
    g.computeVertexNormals();
    return g;
  }

  // ---------- the figure ----------
  class Figure {
    constructor(mount, { theme = "dark", width = 640, height = 420, azimuth = 40, elevation = 32, hint = "", readout = "" } = {}) {
      this.mount = typeof mount === "string" ? document.querySelector(mount) : mount;
      this.theme = THEMES[theme] ? theme : "dark";
      this.T = THEMES[this.theme];
      this.width = width; this.height = height;
      this.azimuth = azimuth; this.elevation = elevation;
      this.parts = [];          // every mesh we made, with its tone
      this.updaters = [];       // per-frame fns (dt, t)
      this.channels = {};       // named scalars that ease toward a target: { v, to, tau }
      this.cut = null;          // clipping plane or null
      this.view = null; this.viewTo = null; this.focusBox = null;
      this.gradient = gradientMap();
      this.running = false; this.visible = false; this.last = 0; this.time = 0;
      this.reduced = global.matchMedia && global.matchMedia("(prefers-reduced-motion: reduce)").matches;
      this.#dom(hint, readout);
      this.#scene();
      this.#input();
    }
    #dom(hint, readout) {
      const m = this.mount;
      m.classList.add("mech");
      m.innerHTML = `<div class="mech-stage" tabindex="0" role="img"><canvas></canvas></div><div class="mech-foot"><span class="mech-hint">${hint}</span><code class="mech-readout">${readout}</code></div>`;
      this.stage = m.querySelector(".mech-stage");
      this.canvas = m.querySelector("canvas");
      this.readoutEl = m.querySelector(".mech-readout");
    }
    #scene() {
      const r = (this.renderer = new T.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true }));
      r.setPixelRatio(Math.min(global.devicePixelRatio || 1, 2));
      r.setSize(this.width, this.height, false);
      r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
      r.localClippingEnabled = true;
      r.setClearColor(0x000000, 0);
      const s = (this.scene = new T.Scene());
      this.root = new T.Group(); s.add(this.root);
      const cam = (this.camera = new T.OrthographicCamera(-1, 1, 1, -1, -2000, 2000));
      cam.up.set(0, 0, 1);
      s.add(new T.AmbientLight(0xffffff, this.T.ambient));
      const key = (this.key = new T.DirectionalLight(0xffffff, 0.95));
      key.position.set(-120, -220, 300);           // back-left and high: tops lightest, right faces darkest
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.radius = 4; key.shadow.bias = -0.0008;
      s.add(key);
      const fill = new T.DirectionalLight(0xffffff, 0.18); fill.position.set(200, 120, 80); s.add(fill);
      // ground that only receives shadow
      const gm = new T.ShadowMaterial({ opacity: this.T.shadow });
      this.ground = new T.Mesh(new T.PlaneGeometry(4000, 4000), gm);
      this.ground.receiveShadow = true; this.ground.position.z = -0.01;
      s.add(this.ground);
    }
    #input() {
      const st = this.stage;
      let drag = null;
      st.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, az: this.azimuth, el: this.elevation }; st.setPointerCapture(e.pointerId); this.run(); });
      st.addEventListener("pointermove", (e) => { if (!drag) return; this.azimuth = drag.az + (e.clientX - drag.x) * 0.4; this.elevation = Math.max(8, Math.min(80, drag.el + (e.clientY - drag.y) * 0.3)); this.fit(); this.run(); });
      st.addEventListener("pointerup", () => (drag = null));
      st.addEventListener("keydown", (e) => {
        if (e.key === "e" || e.key === "E") { this.setExplode(this.ch("explode") < 0.5 ? 1 : 0); e.preventDefault(); }
        if (e.key === "c" || e.key === "C") { this.toggleCut(); e.preventDefault(); }
        if (e.key === "ArrowLeft") { this.azimuth -= 15; this.fit(); e.preventDefault(); }
        if (e.key === "ArrowRight") { this.azimuth += 15; this.fit(); e.preventDefault(); }
        if (e.key === "ArrowUp") { this.elevation = Math.min(80, this.elevation + 8); this.fit(); e.preventDefault(); }
        if (e.key === "ArrowDown") { this.elevation = Math.max(8, this.elevation - 8); this.fit(); e.preventDefault(); }
        if ((e.key === " " || e.key === "Enter") && this.onPress) { this.onPress(e); e.preventDefault(); }
        this.run();
      });
      if (global.IntersectionObserver) new IntersectionObserver((en) => { this.visible = en[en.length - 1].isIntersecting; if (this.visible) this.run(); }, { rootMargin: "120px 0px" }).observe(st);
      else this.visible = true;
    }

    // ---- materials ----
    material(tone = "hi", { lit = false, color } = {}) {
      const c = color !== undefined ? color : lit ? this.T.lit : this.T[tone] ?? this.T.hi;
      const m = new T.MeshToonMaterial({ color: c, gradientMap: this.gradient });
      m.clippingPlanes = this.cut ? [this.cut] : [];
      m.clipShadows = true;
      m.transparent = true;
      return m;
    }
    // ---- adding parts ----
    // geo: a BufferGeometry standing on z=0. opts: tone, lit, at:[x,y,z], rot:[rx,ry,rz], edges (deg threshold or false), name, explode:[dx,dy,dz], group
    add(geo, { tone = "hi", lit = false, color, at = [0, 0, 0], rot = [0, 0, 0], edges = 28, edgeTone, name, explode, channel = "explode", group, shadow = true, tag } = {}) {
      const mesh = new T.Mesh(geo, this.material(tone, { lit, color }));
      mesh.castShadow = shadow; mesh.receiveShadow = true;
      mesh.position.set(...at); mesh.rotation.set(...rot);
      mesh.name = name || "";
      if (edges !== false) {
        const eg = new T.EdgesGeometry(geo, edges);
        const em = new T.LineBasicMaterial({ color: edgeTone === "lo" ? this.T.edgeLo : lit ? this.T.lit : tone === "lo" ? this.T.edgeLo : this.T.edge, transparent: true, opacity: tone === "lo" ? 0.7 : 0.9 });
        em.userData.base = em.opacity;
        em.clippingPlanes = this.cut ? [this.cut] : [];
        const lines = new T.LineSegments(eg, em);
        lines.renderOrder = 1;
        mesh.add(lines);
        mesh.userData.edges = lines;
      }
      mesh.userData.rest = mesh.position.clone();
      mesh.userData.explode = explode ? new T.Vector3(...explode) : null;
      mesh.userData.channel = channel; mesh.userData.tag = tag; mesh.userData.alpha = 1; mesh.userData.alphaTo = 1; mesh.userData.shadow = shadow;
      (group || this.root).add(mesh);
      this.parts.push(mesh);
      return mesh;
    }
    group(opts = {}) {
      const g = new T.Group();
      if (opts.at) g.position.set(...opts.at);
      if (opts.rot) g.rotation.set(...opts.rot);
      g.userData.rest = g.position.clone();
      g.userData.explode = opts.explode ? new T.Vector3(...opts.explode) : null;
      g.userData.channel = opts.channel || "explode";
      (opts.group || this.root).add(g);
      this.parts.push(g);
      return g;
    }
    // sugar
    box(o, opts) { return this.add(boxGeo(o), opts); }
    cyl(o, opts) { return this.add(cylGeo(o), opts); }
    tube(points, r, opts = {}) { return this.add(tubeGeo(points, r, opts), Object.assign({ edges: false, tone: "mid" }, opts)); }
    // small decorations
    screws(points, r = 0.6, opts = {}) { return points.map(([x, y, z]) => this.cyl({ r, h: 0.3, n: 10 }, Object.assign({ tone: "lo", at: [x, y, z], edges: false, shadow: false }, opts))); }
    led(at, r = 0.9, opts = {}) {
      const seat = this.cyl({ r: r + 0.4, h: 0.4, n: 12 }, { tone: "lo", at, edges: false, shadow: false, group: opts.group, tag: opts.tag });
      const dome = this.cyl({ r, h: 0.6, n: 12 }, { tone: "mid", at: [at[0], at[1], at[2] + 0.4], edges: false, shadow: false, group: opts.group, tag: opts.tag });
      dome.userData.led = { on: new T.Color(opts.color || this.T.lit), off: new T.Color(this.T.mid) };
      return dome;
    }
    setLed(mesh, on) { const l = mesh.userData.led; if (!l || l.state === on) return; l.state = on; mesh.material.color.copy(on ? l.on : l.off); mesh.material.emissive.copy(on ? l.on : new T.Color(0)).multiplyScalar(0.6); }
    // glow: 0..1 heat on a part (emissive), for hot or active things
    glow(mesh, k, color = 0xff8a2a) { mesh.material.emissive.set(color).multiplyScalar(Math.max(0, Math.min(1, k))); }
    // ghost: fade parts to an opacity (0 hides them). Accepts meshes, groups or tags.
    ghost(what, alpha) {
      const set = (o) => o.traverse((m) => { if (m.isMesh && m.userData.alphaTo !== undefined) m.userData.alphaTo = alpha; });
      for (const w of [].concat(what)) { if (typeof w === "string") this.parts.forEach((p) => p.userData.tag === w && set(p)); else set(w); }
      this.run();
    }
    // channels: named numbers that ease to a target. Read with ch(name).
    to(name, value, tau = 0.25) { const c = (this.channels[name] ||= { v: 0, to: 0, tau }); c.to = value; c.tau = tau; this.run(); }
    ch(name) { return this.channels[name] ? this.channels[name].v : 0; }
    fins(count, { x = 0, y = 0, z = 0, w = 1.2, d = 10, h = 2.5, gap = 3 } = {}, opts = {}) {
      const out = [];
      for (let i = 0; i < count; i++) out.push(this.box({ w, d, h, r: 0.2 }, Object.assign({ tone: "mid", at: [x + i * gap, y, z], edges: 40 }, opts)));
      return out;
    }
    knob({ r = 3, h = 2.6, knurls = 24 } = {}, opts = {}) {
      const g = this.group(opts);
      this.cyl({ r, h, n: 32 }, { tone: "mid", group: g });
      for (let i = 0; i < knurls; i++) { const a = (i / knurls) * Math.PI * 2; this.box({ w: 0.35, d: 0.6, h: h * 0.8 }, { tone: "lo", at: [Math.cos(a) * r, Math.sin(a) * r, h * 0.1], rot: [0, 0, a], edges: false, shadow: false, group: g }); }
      this.box({ w: r * 0.8, d: 0.4, h: 0.3 }, { tone: "hi", lit: true, at: [-r * 0.35, 0, h], edges: false, shadow: false, group: g });
      return g;
    }

    // ---- camera ----
    // focus(target?, { azimuth, elevation, pad }): ease the camera to frame an object (default: everything).
    focus(target, { azimuth, elevation, pad = 1.12, snap = false } = {}) {
      if (azimuth !== undefined) this.azimuth = azimuth;
      if (elevation !== undefined) this.elevation = elevation;
      this.focusBox = target && target.isBox3 ? target.clone() : new T.Box3().setFromObject(target || this.root);
      this.pad = pad;
      this.fit(snap);
      this.run();
    }
    fit(snap = false) {
      const box = this.focusBox || (this.focusBox = new T.Box3().setFromObject(this.root));
      if (box.isEmpty()) return;
      const a = (this.azimuth * Math.PI) / 180, e = (this.elevation * Math.PI) / 180;
      const dir = new T.Vector3(Math.sin(a) * Math.cos(e), -Math.cos(a) * Math.cos(e), Math.sin(e));
      const c = box.getCenter(new T.Vector3());
      const right = new T.Vector3().crossVectors(new T.Vector3(0, 0, 1), dir).normalize();
      const up = new T.Vector3().crossVectors(dir, right).normalize();
      let hw = 0, hh = 0;
      for (let i = 0; i < 8; i++) {
        const p = new T.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).sub(c);
        hw = Math.max(hw, Math.abs(p.dot(right))); hh = Math.max(hh, Math.abs(p.dot(up)));
      }
      const asp = this.width / this.height;
      const half = Math.max(hh, hw / asp) * (this.pad || 1.12);
      this.viewTo = { c, half, az: this.azimuth, el: this.elevation };
      if (snap || !this.view) this.view = { c: c.clone(), half, az: this.azimuth, el: this.elevation };
      if (!this.shadowSet) {
        const all = new T.Box3().setFromObject(this.root), ac = all.getCenter(new T.Vector3());
        const sz = Math.max(all.max.x - all.min.x, all.max.y - all.min.y) * 0.75;
        Object.assign(this.key.shadow.camera, { left: -sz, right: sz, top: sz, bottom: -sz, near: 1, far: 1600 });
        this.key.target.position.copy(ac); this.scene.add(this.key.target);
        this.key.position.copy(ac).add(new T.Vector3(-140, -260, 420));
        this.key.shadow.camera.updateProjectionMatrix();
        this.shadowSet = true;
      }
      this.fitted = true;
    }
    #applyView() {
      const v = this.view, a = (v.az * Math.PI) / 180, e = (v.el * Math.PI) / 180;
      const dir = new T.Vector3(Math.sin(a) * Math.cos(e), -Math.cos(a) * Math.cos(e), Math.sin(e));
      this.camera.position.copy(v.c).addScaledVector(dir, 900);
      this.camera.lookAt(v.c);
      const asp = this.width / this.height;
      Object.assign(this.camera, { left: -v.half * asp, right: v.half * asp, top: v.half, bottom: -v.half });
      this.camera.updateProjectionMatrix();
    }

    // ---- motion ----
    onFrame(fn) { this.updaters.push(fn); }
    setExplode(t, channel = "explode") { this.to(channel, Math.max(0, Math.min(1, t))); }
    toggleCut() { if (this.cut) this.setCut(null); else this.setCut(this.cutPlane || { normal: [0, 1, 0], at: 0 }); }
    // plane: { normal:[x,y,z], at: distance } keeps the half-space on the normal's side
    setCut(plane) {
      this.cutPlane = plane || this.cutPlane;
      this.cut = plane ? new T.Plane(new T.Vector3(...plane.normal).normalize(), -plane.at) : null;
      for (const p of this.parts) {
        if (!p.isMesh) continue;
        p.material.clippingPlanes = this.cut ? [this.cut] : [];
        if (p.userData.edges) p.userData.edges.material.clippingPlanes = this.cut ? [this.cut] : [];
      }
      this.run();
    }
    spin(obj, axis = "z", rpm = 60, scale = 1) { this.onFrame((dt) => { const w = (rpm * scale) / 60 * 2 * Math.PI; obj.rotation[axis] += w * dt; }); }
    shadow(k) { this.ground.material.opacity = this.T.shadow * k; }
    readout(text) { if (this.readoutEl.textContent !== text) this.readoutEl.textContent = text; }

    run() { if (!this.frame && this.visible) { this.last = 0; this.frame = requestAnimationFrame((t) => this.#tick(t)); } }
    #tick(now) {
      const dt = this.last ? Math.min((now - this.last) / 1000, 1 / 30) : 1 / 60;
      this.last = now; this.time += dt;
      if (!this.fitted) this.fit(true);
      const ease = (tau) => (this.reduced ? 1 : 1 - Math.exp(-dt / tau));
      for (const k in this.channels) { const c = this.channels[k]; c.v += (c.to - c.v) * ease(c.tau); if (Math.abs(c.to - c.v) < 1e-4) c.v = c.to; }
      const v = this.view, w = this.viewTo, kv = ease(0.35);
      v.c.lerp(w.c, kv); v.half += (w.half - v.half) * kv; v.az += (w.az - v.az) * kv; v.el += (w.el - v.el) * kv;
      this.#applyView();
      for (const p of this.parts) {
        const u = p.userData;
        if (u.explode) p.position.copy(u.rest).addScaledVector(u.explode, this.ch(u.channel));
        if (p.isMesh && u.alpha !== u.alphaTo) {
          u.alpha += (u.alphaTo - u.alpha) * ease(0.22); if (Math.abs(u.alphaTo - u.alpha) < 0.004) u.alpha = u.alphaTo;
          p.material.opacity = u.alpha; p.material.depthWrite = u.alpha > 0.95; p.castShadow = u.shadow && u.alpha > 0.6;
          p.visible = u.alpha > 0.004;
          if (u.edges) u.edges.material.opacity = u.edges.material.userData.base * Math.min(1, u.alpha * 2.2 + (u.alpha > 0.004 ? 0.12 : 0));
        }
      }
      for (const f of this.updaters) f(dt, this.time);
      this.renderer.render(this.scene, this.camera);
      this.frame = this.visible ? requestAnimationFrame((t) => this.#tick(t)) : 0;
    }
  }

  // ---------- card ----------
  function card(mount, { fig = "Fig 1", title = "", keys = [], caption = "" }) {
    const m = typeof mount === "string" ? document.querySelector(mount) : mount;

.mech-keys span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--m-mid)}

.mech-controls{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:2px 0 8px;font-size:12px;color:var(--m-muted)}
.mech-controls button{font:inherit;color:var(--m-ink);background:transparent;border:1px solid var(--m-rule);border-radius:7px;padding:5px 10px;cursor:pointer}
.mech-controls button[aria-pressed=true]{background:var(--m-ink);color:var(--m-card);border-color:var(--m-ink)}
.mech-controls input[type=range]{flex:1;min-width:120px;accent-color:var(--m-ink)}
.mech-controls .sp{flex-basis:100%;height:0}`;

<script>
/* Twin-turbo hot-V V8 in a performance SUV. Units: centimetres. x forward, y left, z up.

   bore x stroke 86 x 86 mm, cylinders 1-4 on the right bank and 5-8 on the left, firing order 1-3-7-2-6-5-4-8,
   turbochargers inside the V, cylinders 2, 3, 5 and 8 switched off in four-cylinder mode. */
(function () {
  const THEME = document.documentElement.dataset.theme || "dark";

    codOff: [2, 3, 5, 8], codMaxRpm: 3500,
    bank: [-45 * D, 45 * D],                      // right bank (cyl 1-4), left bank (cyl 5-8), from vertical
    pin: [-45 * D, 45 * D, -135 * D, 135 * D],    // cross-plane crank pins, front to rear

  };

  M.fireAt = {}; M.order.forEach((c, i) => (M.fireAt[c] = i * 90));
  M.pistonAt = (theta, i, b) => { const a = theta + M.pin[i] - M.bank[b]; return { a, s: M.r * Math.cos(a) + Math.sqrt(M.rod * M.rod - (M.r * Math.sin(a)) ** 2) }; };
  const state = { rpm: 1200, theta: 0, cod: false, stage: 0 };

  // ---------- body shell (generic) ----------
  const WB = 150, WHEEL_R = 39, ARCH = 43;
  const arch = (cx) => ({ arc: [cx, 38, ARCH, Math.PI + 0.235, -0.235, true] });
  const side = [[246, 28], [250, 46], [248, 72], [236, 88], [120, 102], [-232, 108], [-250, 86], [-248, 42], [-240, 28], arch(-WB), arch(WB)];
  for (const y of [-97, 97]) F.add(mech.profileGeo(side, 6, y), { tone: "hi", tag: "body" });

  F.box({ w: 208, d: 186, h: 70, r: 2 }, { tone: "mid", at: [0, 0, 30], tag: "body", edges: false });
  F.box({ w: 367, d: 188, h: 4, r: 3 }, { tone: "hi", at: [-63, 0, 100], tag: "body" });
  F.box({ w: 8, d: 188, h: 66, r: 2 }, { tone: "hi", at: [-245, 0, 36], tag: "body" });
  F.box({ w: 12, d: 188, h: 56, r: 3 }, { tone: "hi", at: [241, 0, 30], tag: "body" });

  for (const s of [-1, 1]) {
    F.box({ w: 2, d: 32, h: 6, r: 1 }, { lit: true, at: [247.4, s * 76, 77], tag: "body", shadow: false });   // headlights
    F.box({ w: 2, d: 26, h: 12, r: 2 }, { tone: "lo", at: [247.4, s * 77, 34], tag: "body", shadow: false }); // lower intakes
    F.box({ w: 14, d: 6, h: 7, r: 2 }, { tone: "hi", at: [104, s * 103, 104], tag: "body" });                 // mirrors
    F.box({ w: 10, d: 1.2, h: 2 }, { tone: "lo", at: [10, s * 100.4, 88], tag: "body", edges: false, shadow: false });  // door handles
    F.box({ w: 10, d: 1.2, h: 2 }, { tone: "lo", at: [-92, s * 100.4, 90], tag: "body", edges: false, shadow: false });
  }

  const glass = [[120, 102], [66, 162], [-50, 174], [-186, 147], [-234, 108]];
  F.add(mech.profileGeo(glass, 176, 0), { tone: "lo", tag: "body" });
  F.add(mech.profileGeo([[64, 163.6], [-50, 175.6], [-182, 149.4], [-180, 146.8], [-50, 172.6], [62, 160.8]], 168, 0), { tone: "hi", tag: "body" }); // roof skin
  // hood on a rear hinge
  const hood = F.group({ at: [120, 0, 102], rot: [0, 0.12, 0] });
  F.box({ w: 117, d: 187, h: 3, r: 8 }, { tone: "hi", at: [58.5, 0, -1.5], group: hood, tag: "hood" });
  F.box({ w: 70, d: 4, h: 1 }, { tone: "mid", at: [60, 44, 1.5], group: hood, tag: "hood", edges: false, shadow: false });
  F.box({ w: 70, d: 4, h: 1 }, { tone: "mid", at: [60, -44, 1.5], group: hood, tag: "hood", edges: false, shadow: false });
  F.onFrame(() => (hood.rotation.y = 0.12 - 1.05 * F.ch("hood")));

  // ---------- wheels ----------
  for (const x of [-WB, WB]) for (const s of [-1, 1]) {
    const y = s * 84;
    F.cyl({ r: WHEEL_R, h: 29, n: 40, axis: "y" }, { tone: "lo", at: [x, y - 14.5, WHEEL_R], tag: "wheel", edges: 40 });
    F.cyl({ r: 28, h: 30, n: 36, axis: "y" }, { tone: "mid", at: [x, y - 15, WHEEL_R], tag: "wheel", edges: 40 });
    F.cyl({ r: 21, h: 3, n: 30, axis: "y" }, { tone: "hi", at: [x, y + s * 9 - 1.5, WHEEL_R], tag: "wheel", edges: 40 });    // brake disc
    F.box({ w: 14, d: 5, h: 9, r: 2 }, { color: 0xc8372f, at: [x - 12, y + s * 9, WHEEL_R + 8], tag: "wheel", edges: false });   // caliper
    for (let k = 0; k < 5; k++) F.box({ w: 5, d: 1.6, h: 27, r: 1 }, { lit: true, at: [x, y + s * 15.4, WHEEL_R], rot: [0, (k * 72 + 18) * D, 0], tag: "wheel", edges: false, shadow: false });
    F.cyl({ r: 5, h: 2, n: 16, axis: "y" }, { tone: "hi", at: [x, y + s * 15.4 - 1, WHEEL_R], tag: "wheel", edges: false });
  }

  // ---------- chassis and driveline ----------
  const C = { tag: "chassis" };
  F.box({ w: 470, d: 136, h: 3, r: 4 }, { tone: "lo", at: [0, 0, 26], ...C });
  for (const x of [22, -78]) for (const s of [-1, 1]) {
    F.box({ w: 50, d: 48, h: 13, r: 5 }, { tone: "mid", at: [x, s * 38, 44], ...C });
    F.box({ w: 12, d: 48, h: 62, r: 4 }, { tone: "mid", at: [x - 27, s * 38, 52], rot: [0, -0.22, 0], ...C });
    F.box({ w: 9, d: 22, h: 14, r: 3 }, { tone: "mid", at: [x - 41, s * 38, 114], rot: [0, -0.22, 0], ...C });
  }
  F.box({ w: 62, d: 104, h: 16, r: 5 }, { tone: "mid", at: [-112, 0, 30], ...C });                                   // fuel tank
  const batt = F.box({ w: 40, d: 30, h: 14, r: 2 }, { tone: "hi", at: [-206, 32, 34], ...C });                       // 48 V battery
  F.fins(5, { x: -220, y: 32, z: 48, w: 1, d: 24, h: 1.5, gap: 7 }, C);
  F.cyl({ r: 17, h: 16, n: 32, axis: "x" }, { tone: "hi", at: [138, 0, 50], ...C });                                 // bell housing
  F.box({ w: 72, d: 30, h: 28, r: 8 }, { tone: "hi", at: [103, 0, 36], ...C });                                     // 8-speed gearbox
  for (let i = 0; i < 6; i++) F.box({ w: 1.2, d: 31, h: 29, r: 8 }, { tone: "mid", at: [76 + i * 11, 0, 35.5], edges: false, ...C });
  F.cyl({ r: 10, h: 12, n: 24, axis: "x" }, { tone: "hi", at: [56, 0, 46], ...C });                                  // centre differential
  F.cyl({ r: 3, h: 190, n: 14, axis: "x" }, { tone: "mid", at: [-134, 0, 44], ...C });                               // propshaft
  F.box({ w: 28, d: 32, h: 24, r: 8 }, { tone: "hi", at: [-150, 0, 28], ...C });                                     // rear differential
  for (const x of [-WB, WB]) F.cyl({ r: 2.6, h: 140, n: 12, axis: "y" }, { tone: "mid", at: [x, -70, 39], ...C });   // half shafts
  F.box({ w: 5, d: 124, h: 48, r: 2 }, { tone: "mid", at: [229, 0, 34], ...C });                                     // radiator pack
  for (let i = 0; i < 20; i++) F.box({ w: 0.6, d: 0.8, h: 44 }, { tone: "lo", at: [231.8, -57 + i * 6, 36], edges: false, shadow: false, ...C });
  const exhaust = [];
  for (const s of [-1, 1]) {
    exhaust.push(F.tube([[141, s * 11, 42], [118, s * 13, 34], [20, s * 14, 32], [-120, s * 15, 46], [-170, s * 44, 34], [-192, s * 55, 36]], 3.2, { tone: "mid", ...C }));
    F.cyl({ r: 10, h: 44, n: 24, axis: "x" }, { tone: "mid", at: [-236, s * 56, 38], ...C });                        // rear silencer
    const tip = F.cyl({ r: 6, h: 10, n: 24, axis: "x" }, { tone: "hi", at: [-254, s * 62, 36], ...C });              // oval tailpipe
    tip.scale.set(1, 1.7, 1);
  }

  // ---------- engine ----------
  const E = F.group({ at: [176, 0, 50] });
  const SH = { group: E, tag: "shell" };
  F.box({ w: 42, d: 21, h: 18, r: 3 }, { tone: "hi", at: [0, 0, -10], ...SH });                                      // crankcase
  F.box({ w: 38, d: 16, h: 8, r: 3 }, { tone: "mid", at: [0, 0, -18], ...SH });                                      // oil pan
  F.fins(9, { x: -16, y: 0, z: -18.6, w: 0.8, d: 14, h: 0.8, gap: 4 }, { group: E, tag: "shell", tone: "lo", edges: false });
  F.box({ w: 2.4, d: 34, h: 30, r: 6 }, { tone: "mid", at: [22, 0, -9], ...SH });                                    // front cover
  const BRIGHT = THEME === "dark" ? 0xa8a8a8 : 0x8a8985, MIDB = THEME === "dark" ? 0x7c7c7c : 0x696865;
  const cylX = (i, b) => (1.5 - i) * M.spacing + (b ? -0.9 : 0.9);
  const cyls = [];            // { n, piston, rod, fire, coil, i, b }
  const banks = [0, 1].map((b) => {
    const sgn = b ? 1 : -1;
    const B = F.group({ group: E, rot: [-M.bank[b], 0, 0] });
    const sh = { group: B, tag: "shell" };
    F.box({ w: 41, d: 11.4, h: 16.5, r: 1 }, { tone: "hi", at: [0, 0, 7], ...sh });                                  // cylinder bank
    F.box({ w: 41, d: 13, h: 7.5, r: 1.5 }, { tone: "hi", at: [0, 0, 23.5], ...sh });                                // cylinder head
    F.box({ w: 39.5, d: 12, h: 2.6, r: 2.5 }, { tone: "mid", at: [0, 0, 31], ...sh });                               // cam cover
    for (const y of [-3.4, 3.4]) F.cyl({ r: 1.7, h: 38, n: 14, axis: "x" }, { tone: "mid", at: [-19, y, 33.2], edges: false, ...sh });
    F.box({ w: 36, d: 6, h: 9, r: 2.8 }, { tone: "mid", at: [0, sgn * 10, 20.5], ...sh });                           // intake plenum, outboard
    F.screws([[-19, sgn * 5, 31], [19, sgn * 5, 31], [-19, -sgn * 5, 31], [19, -sgn * 5, 31]], 0.5, { group: B, tag: "shell" });
    for (let i = 0; i < 4; i++) {
      const n = b * 4 + i + 1, x = cylX(i, b);
      F.box({ w: 5, d: 3.4, h: 4, r: 1 }, { tone: "mid", at: [x, sgn * 7.2, 24.6], ...sh });                         // intake runner
      F.cyl({ r: 1.5, h: 2.2, n: 12 }, { tone: "lo", at: [x, 0, 33.6], ...sh });                                     // ignition coil
      const coil = F.led([x, 0, 35.8], 0.8, { group: B, color: 0xffa033, tag: "shell" });
      const piston = F.cyl({ r: M.bore / 2 - 0.15, h: 5, n: 28 }, { lit: true, at: [x, 0, 0], group: B, tag: "moving", edges: 40 });
      F.cyl({ r: M.bore / 2 - 0.05, h: 0.5, n: 28 }, { tone: "mid", at: [0, 0, 3.4], group: piston, edges: false, shadow: false });  // ring land
      const rod = F.box({ w: 1.6, d: 2.6, h: M.rod, r: 0.5 }, { color: MIDB, at: [x, 0, 0], group: B, tag: "moving" });
      const fire = F.cyl({ r: M.bore / 2 - 0.3, h: 1.2, n: 24 }, { color: 0xffa033, at: [x, 0, 22.2], group: B, tag: "fire", edges: false, shadow: false });
      fire.material.emissive.set(0xff7a1a); fire.visible = false;

  const AUX = { group: E, tag: "aux" };
  F.cyl({ r: 6, h: 13, n: 24, axis: "x" }, { tone: "hi", at: [10, -25, -2], ...AUX });
  F.fins(4, { x: 12, y: -25, z: 4, w: 0.8, d: 6, h: 1, gap: 3 }, { group: E, tag: "aux", edges: false });
  const bsgPulley = F.cyl({ r: 3.4, h: 3, n: 18, axis: "x" }, { tone: "mid", at: [24.6, -25, -2], ...AUX });
  F.tube([[26, 0, 8.4], [26, -25, 1.6], [26, -28.6, -2], [26, -25, -5.6], [26, 0, -8.4], [26, 8.4, 0]], 0.7, { tone: "lo", closed: true, ...AUX });
  // turbochargers in the V, one per bank
  const turbos = [0, 1].map((b) => {
    const sgn = b ? 1 : -1, tx = b ? -6 : 4, ty = sgn * 6.6, tz = 28.5;
    const G = F.group({ group: E, at: [tx, ty, tz] });
    const T = { group: G, tag: "turbo" };
    F.cyl({ r: 2.6, h: 4.4, n: 16, axis: "x" }, { tone: "mid", at: [-2.2, 0, 0], ...T });                            // bearing housing
    F.cyl({ r: 5.7, h: 4, n: 30, axis: "x" }, { tone: "hi", at: [2.2, 0, 0], ...T });                                // compressor housing
    F.cyl({ r: 3.1, h: 3, n: 20, axis: "x" }, { tone: "hi", at: [6.2, 0, 0], ...T });                                // compressor inlet
    const hot = F.cyl({ r: 5.3, h: 4.6, n: 30, axis: "x" }, { tone: "mid", at: [-6.8, 0, 0], ...T });                // turbine housing
    F.cyl({ r: 1.6, h: 5, n: 12, axis: "y" }, { tone: "mid", at: [-4.5, sgn > 0 ? 0 : -5, 6], ...T, edges: false }); // wastegate actuator
    const wheel = F.group({ group: G, at: [9.3, 0, 0] });
    for (let k = 0; k < 6; k++) F.box({ w: 0.5, d: 0.7, h: 2.7 }, { lit: true, at: [0, 0, 0], rot: [k * 60 * D, 0, 0], group: wheel, tag: "turbo", edges: false, shadow: false });
    // exhaust runners from the inboard side of the head into the turbine
    const runners = [];
    for (let i = 0; i < 4; i++) {
      const x = cylX(i, b), py = sgn * 14.6, pz = 23.6;
      runners.push(F.tube([[x, py, pz], [(x + tx - 6.8) / 2, sgn * 13.4, 25.6], [tx - 4.6, sgn * 11.6, 27.2]], 1.3, { tone: "mid", group: E, tag: "pipes" }));
    }
    // downpipe to the exhaust, intake from the airbox, charge pipe to the plenum
    const down = F.tube([[tx - 6.8, ty, tz], [-22, sgn * 8, 28], [-31, sgn * 10, 12], [-35, sgn * 11, -8]], 3, { tone: "mid", group: E, tag: "pipes" });
    F.tube([[tx + 9.2, ty, tz], [26, sgn * 11, 30], [33, sgn * 22, 26], [38, sgn * 29, 22]], 2.8, { tone: "lo", group: E, tag: "pipes" });
    F.box({ w: 18, d: 18, h: 14, r: 4 }, { tone: "mid", at: [42, sgn * 32, 10], group: E, tag: "pipes" });           // air filter box
    F.tube([[tx + 4, sgn * 11.4, 31.5], [21, sgn * 15, 33], [26, sgn * 26, 27], [21, sgn * 27.5, 15.5], [17, sgn * 25.6, 13]], 2.1, { tone: "hi", group: E, tag: "pipes" });
    return { hot, wheel, runners, down };
  });

  // ---------- running ----------
  const firing = (n, cyc) => { if (state.cod && M.codOff.includes(n)) return false; const d = (((cyc - M.fireAt[n]) % 720) + 720) % 720; return d < 70; };
  F.onFrame((dt) => {
    if (state.cod && state.rpm > M.codMaxRpm) setCod(false);
    if (!F.reduced) state.theta += (state.rpm * 6 * D * dt) / M.slow;
    const th = state.theta, cyc = ((th / D) % 720 + 720) % 720;
    crank.rotation.x = -th;
    bsgPulley.rotation.x = -th * 2.35;
    for (const c of cyls) {
      const { a, s } = M.pistonAt(th, c.i, c.b);
      c.piston.position.z = s - 2.5;
      c.rod.position.set(c.x, M.r * Math.sin(a), M.r * Math.cos(a));
      c.rod.rotation.x = Math.atan2(M.r * Math.sin(a), s - M.r * Math.cos(a));
      const on = firing(c.n, cyc);
      c.fire.visible = on && state.stage === 4;
      F.setLed(c.coil, on);
    }
    const load = (state.rpm - M.idle) / (M.redline - M.idle);
    for (const t of turbos) {
      t.wheel.rotation.x -= (0.6 + load * 5) * 6 * dt;
      F.glow(t.hot, 0.08 + load * 0.75); t.runners.forEach((r) => F.glow(r, 0.05 + load * 0.6)); F.glow(t.down, load * 0.35);
    }
    const now = state.cod ? [1, 7, 6, 4] : M.order;
    const cur = M.order[Math.floor(cyc / 90) % 8];
    const live = state.cod && M.codOff.includes(cur) ? "–" : cur;
    F.readout(Math.round(state.rpm).toLocaleString("en-US") + " rpm · firing cyl " + live + " · order " + now.join("-"));
  });

  // ---------- stages ----------
  const all = (a) => F.ghost(["body", "hood", "wheel", "chassis", "shell", "aux", "turbo", "pipes", "moving"], a);
  const front = new THREE.Box3(new THREE.Vector3(96, -108, 18), new THREE.Vector3(258, 108, 176));
  const STAGES = [
    { name: "Car", hint: "A front-engined performance SUV. Drag to turn it.", go() { all(1); F.shadow(1); F.to("hood", 0); F.focus(null, { azimuth: 38, elevation: 24 }); } },
    { name: "Hood up", hint: "The V8 sits lengthwise, ahead of the front axle.", go() { all(1); F.shadow(1); F.to("hood", 1, 0.4); F.focus(front, { azimuth: 58, elevation: 36, pad: 1.12 }); } },
    { name: "See-through", hint: "Engine, 8-speed gearbox, propshaft, both axles, twin exhausts, 48 V battery at the back.", go() { all(1); F.shadow(0.5); F.ghost(["body", "hood"], 0.06); F.ghost("wheel", 0.45); F.to("hood", 0); F.focus(null, { azimuth: 30, elevation: 34 }); } },
    { name: "Engine", hint: "Two turbochargers sit inside the V. Exhaust goes in from the middle, fresh air comes in from the outside.", go() { all(1); F.shadow(0); F.ghost(["body", "hood", "wheel"], 0); F.ghost("chassis", 0.035); F.to("hood", 0); F.focus(E, { azimuth: 42, elevation: 30, pad: 0.86 }); } },
    { name: "Inside", hint: "Eight pistons on a cross-plane crank. The flash is the cylinder that fires.", go() { all(1); F.ghost(["body", "hood", "wheel", "chassis"], 0); F.shadow(0); F.ghost("shell", 0.07); F.ghost("pipes", 0.06); F.ghost("aux", 0.2); F.ghost("turbo", 0.14); F.to("hood", 0); F.focus(E, { azimuth: 24, elevation: 20, pad: 0.86 }); } },
  ];

  // ---------- controls ----------
  const bar = document.createElement("div"); bar.className = "mech-controls";
  bar.innerHTML = STAGES.map((s, i) => `<button data-stage="${i}">${i + 1} ${s.name}</button>`).join("") +
    `<span class="sp"></span><span>Throttle</span><input type="range" min="${M.idle}" max="${M.redline}" step="50" value="${state.rpm}" aria-label="Engine speed in rpm"><button data-cod aria-pressed="false">4-cylinder mode</button>`;
  F.mount.querySelector(".mech-stage").after(bar);
  const hintEl = F.mount.querySelector(".mech-hint"), codBtn = bar.querySelector("[data-cod]"), slider = bar.querySelector("input");
  function setStage(i) { state.stage = Math.max(0, Math.min(STAGES.length - 1, i)); STAGES[state.stage].go(); hintEl.textContent = STAGES[state.stage].hint; bar.querySelectorAll("[data-stage]").forEach((b, k) => b.setAttribute("aria-pressed", k === state.stage)); }
  function setCod(on) { state.cod = on && state.rpm <= M.codMaxRpm; codBtn.setAttribute("aria-pressed", state.cod); }
  bar.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.stage) setStage(+b.dataset.stage); else setCod(!state.cod); });
  slider.addEventListener("input", () => { state.rpm = +slider.value; codBtn.disabled = state.rpm > M.codMaxRpm; codBtn.style.opacity = codBtn.disabled ? 0.4 : 1; F.run(); });
  F.stage.addEventListener("keydown", (e) => { if (e.key >= "1" && e.key <= "5") setStage(+e.key - 1); });
  F.onPress = () => setStage((state.stage + 1) % STAGES.length);

  mech.card("#fig", {
    fig: "Fig 1", title: "Twin-turbo V8 in a performance SUV",
    keys: [{ mark: "lit", label: "Pistons: what the crank moves" }, { mark: "mid", label: "Keys 1 to 5 step in. Space goes to the next step. Drag to orbit." }],
    caption: "A 4.0 litre, 90 degree V8 with an 86 mm bore and an 86 mm stroke. Cylinders 1 to 4 are on the right bank and 5 to 8 on the left, and they fire in the order 1-3-7-2-6-5-4-8. Both turbochargers sit inside the V, so the exhaust path from each head to its turbine is short. In 4-cylinder mode, cylinders 2, 3, 5 and 8 switch off and the rest fire 1-7-6-4. The motion is shown 50 times slower than real time. The body is a generic shell.",
  });
  window.fig = F; window.setStage = setStage; window.state = state;
  setStage(0);
  F.focus(null, { snap: true });
})();

</script>
</body>
</html>
