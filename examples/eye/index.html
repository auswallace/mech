<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the eye focuses near and far</title>
<style>
:root{--m-paper:#121212;--m-ink:#e8e8e8;--m-muted:#8a8a8a;--m-card:#161616;--m-rule:#2a2a2a;--m-lit:#fff;--m-mid:#6a6a6a}
[data-theme=light]{--m-paper:#f7f7f5;--m-ink:#1a1a1a;--m-muted:#6b6b70;--m-card:#fff;--m-rule:#e2e2e0;--m-lit:#000;--m-mid:#9a9a9f}
body{margin:0;background:var(--m-paper);color:var(--m-ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.mech{max-width:680px;margin:28px auto;background:var(--m-card);border:1px solid var(--m-rule);border-radius:12px;padding:14px 16px 12px}
.mech-head,.mech-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--m-muted)}
.mech-head b{color:var(--m-ink);font-weight:500;margin-left:auto}
.mech-theme{font:inherit;font-size:11px;color:var(--m-muted);background:transparent;border:1px solid var(--m-rule);border-radius:6px;padding:2px 8px;margin-left:10px;cursor:pointer}
.mech-stage{outline:none;cursor:grab;margin:6px 0;border-radius:8px}
.mech-stage:active{cursor:grabbing}.mech-stage:focus-visible{box-shadow:0 0 0 2px var(--m-muted)}
.mech-stage canvas{display:block;width:100%;height:auto}
.mech-foot code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--m-ink)}
.mech-keys{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 4px;font-size:12px;color:var(--m-muted)}
.mech-keys span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--m-mid)}
.mech-keys .k-lit::before{background:var(--m-lit)}
.mech-cap{font-size:13px;color:var(--m-muted);margin:6px 0 0}
.mech-controls{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:2px 0 8px;font-size:12px;color:var(--m-muted)}
.mech-controls button{font:inherit;color:var(--m-ink);background:transparent;border:1px solid var(--m-rule);border-radius:7px;padding:5px 10px;cursor:pointer}
.mech-controls button[aria-pressed=true]{background:var(--m-ink);color:var(--m-card);border-color:var(--m-ink)}
.mech-controls input[type=range]{flex:1;min-width:120px;accent-color:var(--m-ink)}
.mech-controls .sp{flex-basis:100%;height:0}
.mech-stage{position:relative}
.mech-over{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mech-leaders{position:absolute;inset:0;width:100%;height:100%}
.mech-leaders path{fill:none;stroke:var(--m-muted);stroke-width:1}.mech-leaders circle{fill:var(--m-ink)}
.mech-label{position:absolute;transform:translateY(-50%);font-size:11.5px;line-height:1.2;white-space:nowrap;color:var(--m-ink);background:var(--m-card);border:1px solid var(--m-rule);border-radius:5px;padding:2px 6px}
.mech-label.pin{transform:translate(-50%,-50%);background:transparent;border:0;font-weight:500;text-shadow:0 0 4px var(--m-card),0 0 4px var(--m-card)}
.mech-label.pin.box{background:var(--m-card);border:1px solid var(--m-rule);font-size:12.5px;padding:3px 8px;text-shadow:none}
.mech-panel{margin:0 0 8px;background:var(--m-card);border:1px solid var(--m-rule);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.45;color:var(--m-muted)}
.mech-label.can{pointer-events:auto;cursor:pointer}.mech-label.can:hover{border-color:var(--m-ink)}
.mech-panel .row{margin-top:3px}.mech-panel u{text-decoration:none;color:var(--m-ink);font-weight:600;margin-right:6px}
.mech-panel small{display:block;margin-top:6px;font-size:11px}.mech-panel small i{font-style:normal;border:1px solid var(--m-rule);border-radius:4px;padding:0 5px;margin-right:5px;color:var(--m-ink)}
.mech-panel b{display:block;color:var(--m-ink);font-weight:600;font-size:13px;margin-bottom:2px}.mech-panel span{display:block}.mech-panel em{display:block;font-style:normal;color:var(--m-ink);margin-top:4px}
.mech-lesson{border:1px solid var(--m-rule);border-radius:9px;padding:9px 11px;margin:0 0 8px;font-size:13px}
.mech-lesson .row{display:flex;align-items:center;gap:8px}.mech-lesson b{font-weight:600}.mech-lesson .n{color:var(--m-muted);font-size:12px;margin-right:auto}
.mech-lesson button{font:inherit;font-size:12px;color:var(--m-ink);background:transparent;border:1px solid var(--m-rule);border-radius:7px;padding:4px 10px;cursor:pointer}
.mech-lesson p{margin:6px 0 0;color:var(--m-muted)}
.mech-sources{border-top:1px solid var(--m-rule);margin-top:10px;padding-top:8px;font-size:12px;color:var(--m-muted)}
.mech-sources b{color:var(--m-ink);font-weight:600}.mech-sources ul{margin:6px 0 0;padding-left:18px}.mech-sources li{margin:3px 0}
.mech-sources i{font-style:normal;border:1px solid var(--m-rule);border-radius:4px;padding:0 5px;font-size:11px;margin:0 4px}.mech-sources a{color:var(--m-ink)}</style>
</head>
<body>
<div id="fig"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* mech: isometric technical figures on a real 3D core.
   World: x right, y toward the viewer, z up. Units are millimetres of the real thing, or whatever you like.
   Uses the global THREE (r128). Everything else is here. */
(function (global) {
  const T = global.THREE;
  const THEMES = {
    dark: { paper: 0x121212, face: 0x1b1b1b, hi: 0x565656, mid: 0x3c3c3c, lo: 0x282828, lit: 0xededed, edge: 0xd8d8d8, edgeLo: 0x7a7a7a, shadow: 0.6, ambient: 0.42 },
    light: { paper: 0xf7f7f5, face: 0xffffff, hi: 0xcfcdc7, mid: 0xa5a39e, lo: 0x6c6b68, lit: 0x232326, edge: 0x2a2a2e, edgeLo: 0x77777c, shadow: 0.2, ambient: 0.3 },
  };
  const GRADIENT = [0.5, 0.68, 0.85, 1.0];
  // Named materials. In style "real" they are physically based. In style "line" each one maps to a tone.
  const MATS = {
    castAl:   { color: 0xb4b8bc, metal: 0.85, rough: 0.58, tone: "hi" },
    machined: { color: 0xdfe2e5, metal: 1.0, rough: 0.22, tone: "hi", lit: true },
    steel:    { color: 0x8e9298, metal: 1.0, rough: 0.36, tone: "mid" },
    darkSteel:{ color: 0x34373c, metal: 0.9, rough: 0.48, tone: "mid" },
    iron:     { color: 0x5a4a41, metal: 0.75, rough: 0.62, tone: "mid" },
    chrome:   { color: 0xffffff, metal: 1.0, rough: 0.07, tone: "hi" },
    brass:    { color: 0xb08d48, metal: 1.0, rough: 0.3, tone: "mid" },
    plastic:  { color: 0x17181b, metal: 0.0, rough: 0.52, tone: "lo" },
    rubber:   { color: 0x0d0d0e, metal: 0.0, rough: 0.92, tone: "lo" },
    glass:    { color: 0x05080b, metal: 0.6, rough: 0.05, tone: "lo", env: 1.4 },
    paint:    { color: 0x1b3657, metal: 0.35, rough: 0.38, clearcoat: 1, tone: "hi" },
    flat:     { color: 0x808080, metal: 0.05, rough: 0.55, tone: "mid" },
    concrete: { color: 0xaeaba3, metal: 0.0, rough: 0.9, tone: "hi" },
    light:    { color: 0xffffff, metal: 0, rough: 0.3, emissive: 0xffffff, tone: "hi", lit: true },
  };

  function gradientMap() {
    const data = new Uint8Array(GRADIENT.map((v) => Math.round(v * 255)));
    const tex = new T.DataTexture(data, GRADIENT.length, 1, T.LuminanceFormat);
    tex.minFilter = tex.magFilter = T.NearestFilter;
    tex.needsUpdate = true;
    return tex;
  }

  // ---------- geometry helpers ----------
  function roundedRect(w, d, r) {
    r = Math.min(r, w / 2, d / 2);
    const s = new T.Shape();
    s.moveTo(-w / 2 + r, -d / 2);
    s.lineTo(w / 2 - r, -d / 2); s.absarc(w / 2 - r, -d / 2 + r, r, -Math.PI / 2, 0, false);
    s.lineTo(w / 2, d / 2 - r); s.absarc(w / 2 - r, d / 2 - r, r, 0, Math.PI / 2, false);
    s.lineTo(-w / 2 + r, d / 2); s.absarc(-w / 2 + r, d / 2 - r, r, Math.PI / 2, Math.PI, false);
    s.lineTo(-w / 2, -d / 2 + r); s.absarc(-w / 2 + r, -d / 2 + r, r, Math.PI, Math.PI * 1.5, false);
    return s;
  }
  // A rounded box standing on z=0, centred at origin in x,y. bevel adds a small chamfer on the top edge.
  function boxGeo({ w = 10, d = 10, h = 10, r = 0, bevel = 0, segments = 4 }) {
    const shape = roundedRect(w, d, r);
    const g = new T.ExtrudeGeometry(shape, { depth: h, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: segments });
    if (bevel > 0) g.translate(0, 0, bevel); // keep base on z=0 after the bevel
    g.computeVertexNormals();
    return g;
  }
  function cylGeo({ r = 5, h = 10, n = 32, axis = "z" }) {
    const g = new T.CylinderGeometry(r, r, h, n, 1, false);
    // CylinderGeometry is along y, centred. Rotate so it stands on z=0 (or lies along x / y).
    if (axis === "z") { g.rotateX(Math.PI / 2); g.translate(0, 0, h / 2); }
    else if (axis === "y") { g.translate(0, h / 2, 0); }
    else if (axis === "x") { g.rotateZ(-Math.PI / 2); g.translate(h / 2, 0, 0); }
    return g;
  }
  function tubeGeo(points, r = 1, { n = 10, bend = 2, closed = false } = {}) {
    const v = points.map((p) => new T.Vector3(p[0], p[1], p[2]));
    const curve = new T.CatmullRomCurve3(v, closed, "centripetal", 0.5);
    return new T.TubeGeometry(curve, Math.max(8, points.length * 12 * bend), r, n, closed);
  }
  // A side profile in the x-z plane, extruded across y. points: [x,z] or { arc:[cx,cz,r,a0,a1,clockwise] }.
  function profileGeo(points, depth, yCenter = 0) {
    const s = new T.Shape(); let first = true;
    for (const p of points) { if (p.arc) s.absarc(...p.arc); else if (first) { s.moveTo(p[0], p[1]); first = false; } else s.lineTo(p[0], p[1]); }
    const g = new T.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 20 });
    g.rotateX(Math.PI / 2); g.translate(0, yCenter + depth / 2, 0);
    g.computeVertexNormals();
    return g;
  }

  // Toothed wheel for a chain or a gear train. Pitch radius = pitch / (2 sin(pi / teeth)). A roller sits in the gap at angle 0.
  function gearGeo({ teeth, pitch, thick = 2, hole = 0, axis = "z", depth = 0.3 }) {
    const R = pitch / (2 * Math.sin(Math.PI / teeth)), rr = R - pitch * depth, rt = R + pitch * depth * 0.9, da = (Math.PI * 2) / teeth, s = new T.Shape();
    for (let i = 0; i < teeth; i++) for (const [f, r] of [[0.24, rr], [0.41, rt], [0.59, rt], [0.76, rr]]) { const a = (i + f) * da, x = r * Math.cos(a), y = r * Math.sin(a); i || f > 0.3 ? s.lineTo(x, y) : s.moveTo(x, y); }
    s.closePath();
    if (hole > 0) { const h = new T.Path(); h.absarc(0, 0, hole, 0, Math.PI * 2, true); s.holes.push(h); }
    const g = new T.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false, curveSegments: 24 }); g.translate(0, 0, -thick / 2);
    if (axis === "y") g.rotateX(Math.PI / 2); else if (axis === "x") g.rotateY(Math.PI / 2);
    g.userData.pitchRadius = R; return g;
  }
  const pitchRadius = (teeth, pitch) => pitch / (2 * Math.sin(Math.PI / teeth));
  // Path of a chain, belt or cable round a closed loop of wheels, in the x-z plane.
  // wheels: [{ c: [x, z], r, s: +1 | -1, y }]. s is the turning sense seen with x to the right and z up: +1 anticlockwise, -1 clockwise.
  // Returns { length, at(distance) -> { x, y, z, ang }, arcs: [length on each wheel] }.
  function wrapPath(wheels) {
    const n = wheels.length, tan = [], seg = [];
    for (let i = 0; i < n; i++) {
      const A = wheels[i], B = wheels[(i + 1) % n], D = [B.c[0] - A.c[0], B.c[1] - A.c[1]], d = Math.hypot(D[0], D[1]), k = B.r * B.s - A.r * A.s;
      const pd = Math.atan2(D[1], D[0]), ac = Math.acos(Math.max(-1, Math.min(1, -k / d)));
      for (const sg of [1, -1]) { const q = [Math.cos(pd + sg * ac), Math.sin(pd + sg * ac)], u = [-q[1], q[0]], L = D[0] * u[0] + D[1] * u[1]; if (L > 0) { tan.push({ a: [A.c[0] + A.r * A.s * q[0], A.c[1] + A.r * A.s * q[1]], b: [B.c[0] + B.r * B.s * q[0], B.c[1] + B.r * B.s * q[1]], L, u }); break; } }
    }
    let length = 0; const arcs = [];
    for (let i = 0; i < n; i++) {
      const t = tan[i], j = (i + 1) % n, W = wheels[j], A = wheels[i];
      seg.push({ line: true, from: length, len: t.L, t, ya: A.y || 0, yb: W.y || 0 }); length += t.L;
      const a0 = Math.atan2(t.b[1] - W.c[1], t.b[0] - W.c[0]), o = tan[j].a, a1 = Math.atan2(o[1] - W.c[1], o[0] - W.c[0]);
      const sweep = (((a1 - a0) * W.s) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      seg.push({ from: length, len: sweep * W.r, a0, sweep, W }); arcs[j] = sweep * W.r; length += sweep * W.r;
    }
    const at = (dist) => {
      dist = ((dist % length) + length) % length; let g = seg[seg.length - 1];
      for (const q of seg) if (dist < q.from + q.len) { g = q; break; }
      const f = g.len ? (dist - g.from) / g.len : 0;
      if (g.line) return { x: g.t.a[0] + g.t.u[0] * g.len * f, z: g.t.a[1] + g.t.u[1] * g.len * f, y: g.ya + (g.yb - g.ya) * f, ang: Math.atan2(g.t.u[1], g.t.u[0]) };
      const a = g.a0 + g.W.s * g.sweep * f; return { x: g.W.c[0] + g.W.r * Math.cos(a), z: g.W.c[1] + g.W.r * Math.sin(a), y: g.W.y || 0, ang: a + g.W.s * Math.PI / 2 };
    };
    return { length, at, arcs };
  }
  // Point on a hop from a to b: t from 0 to 1, lifted by `lift` in the middle. For messages that travel between stations.
  const hop = (a, b, t, lift = 0) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t + lift * Math.sin(Math.PI * t)];
  // Flat plate standing on z = 0 with rectangular holes: { w, d, h, holes: [{ x, y, w, d }] }.
  function plateGeo({ w, d, h, holes = [] }) {
    const s = new T.Shape(); s.moveTo(-w / 2, -d / 2); s.lineTo(w / 2, -d / 2); s.lineTo(w / 2, d / 2); s.lineTo(-w / 2, d / 2); s.closePath();
    for (const o of holes) { const p = new T.Path(); p.moveTo(o.x - o.w / 2, o.y - o.d / 2); p.lineTo(o.x - o.w / 2, o.y + o.d / 2); p.lineTo(o.x + o.w / 2, o.y + o.d / 2); p.lineTo(o.x + o.w / 2, o.y - o.d / 2); p.closePath(); s.holes.push(p); }
    return new T.ExtrudeGeometry(s, { depth: h, bevelEnabled: false });
  }
  // Round part from a profile of [radius, height] pairs, spun about an axis.
  function latheGeo(profile, { axis = "z", n = 36 } = {}) {
    const g = new T.LatheGeometry(profile.map((p) => new T.Vector2(Math.max(p[0], 0.0001), p[1])), n);
    if (axis === "z") g.rotateX(Math.PI / 2); else if (axis === "x") g.rotateZ(-Math.PI / 2);
    g.computeVertexNormals();
    return g;
  }
  function torusGeo({ R = 5, r = 0.5, axis = "z", n = 32 } = {}) {
    const g = new T.TorusGeometry(R, r, 10, n);
    if (axis === "x") g.rotateY(Math.PI / 2); else if (axis === "y") g.rotateX(Math.PI / 2);
    return g;
  }
  // Scroll housing (turbo or pump): a tube wound once round the axis x, growing from r0 to r1.
  function voluteGeo({ R = 3.5, r0 = 1.2, r1 = 2.5, squash = 1 } = {}) {
    const f = (u, v, t) => { const a = u * Math.PI * 1.96, b = v * Math.PI * 2, rt = r0 + (r1 - r0) * u, q = R + rt * Math.cos(b); t.set(rt * Math.sin(b) * squash, q * Math.cos(a), q * Math.sin(a)); };
    const g = new T.ParametricGeometry(f, 56, 14); g.computeVertexNormals(); return g;
  }
  // Closed cross-section of a rounded body: half width W, from z = zb to z = zt. exp 2 is an ellipse, 5 is a soft box.
  function superSection(W, zb, zt, exp = 4.5, count = 44) {
    const sp = (c) => Math.sign(c) * Math.pow(Math.abs(c), 2 / exp), zc = (zb + zt) / 2, hh = (zt - zb) / 2;
    return Array.from({ length: count }, (_, j) => { const a = (j / count) * Math.PI * 2; return [W * sp(Math.cos(a)), zc + hh * sp(Math.sin(a))]; });
  }
  // Interpolate rows of numbers (first column is x) with a Catmull-Rom spline. Returns `steps + 1` rows.
  function sweep(keys, steps = 48) {
    const n = keys.length, out = [];
    const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
    for (let s = 0; s <= steps; s++) {
      const f = (s / steps) * (n - 1), i = Math.min(n - 2, Math.floor(f)), t = f - i;
      const k = (d) => keys[Math.max(0, Math.min(n - 1, i + d))];
      out.push(keys[0].map((_, c) => cr(k(-1)[c], k(0)[c], k(1)[c], k(2)[c], t)));
    }
    return out;
  }
  // Skin a row of sections [{ x, pts: [[y, z], ...] }] into one smooth surface. filter(i, j, n) keeps or drops a panel.
  function loftGeo(sections, { filter, caps = true } = {}) {
    const n = sections[0].pts.length, pos = [], idx = [];
    sections.forEach((s) => s.pts.forEach((p) => pos.push(s.x, p[0], p[1])));
    for (let i = 0; i < sections.length - 1; i++) for (let j = 0; j < n; j++) {
      if (filter && !filter(i, j, n, sections[i].x)) continue;
      const a = i * n + j, b = i * n + ((j + 1) % n), c = (i + 1) * n + j, d = (i + 1) * n + ((j + 1) % n);
      idx.push(a, c, b, b, c, d);
    }
    if (caps && !filter) for (const [si, flip] of [[0, false], [sections.length - 1, true]]) {
      const s = sections[si], c = pos.length / 3, cy = s.pts.reduce((t, p) => t + p[0], 0) / n, cz = s.pts.reduce((t, p) => t + p[1], 0) / n;
      pos.push(s.x, cy, cz);
      for (let j = 0; j < n; j++) { const a = si * n + j, b = si * n + ((j + 1) % n); flip ? idx.push(c, a, b) : idx.push(c, b, a); }
    }
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    return g;
  }

  // ---------- the figure ----------
  const VERSION = "0.7";
  const HILITE = 0x2f8cff;   // the one colour that means "selected"
  class Figure {
    constructor(mount, { theme = "dark", style = "line", width = 640, height = 420, azimuth = 40, elevation = 32, hint = "", readout = "" } = {}) {
      this.mount = typeof mount === "string" ? document.querySelector(mount) : mount;
      this.theme = THEMES[theme] ? theme : "dark";
      this.T = THEMES[this.theme];
      this.style = style === "real" ? "real" : "line"; this.lastInput = performance.now(); this.snap = false;
      this.width = width; this.height = height;
      this.azimuth = azimuth; this.elevation = elevation;
      this.parts = [];          // every mesh we made, with its tone
      this.updaters = [];       // per-frame fns (dt, t)
      this.channels = {};       // named scalars that ease toward a target: { v, to, tau }
      this.cut = null;          // clipping plane or null
      this.view = null; this.viewTo = null; this.focusBox = null;
      this.gradient = gradientMap();
      this.running = false; this.visible = false; this.last = 0; this.time = 0;
      this.reduced = global.matchMedia && global.matchMedia("(prefers-reduced-motion: reduce)").matches;
      global.mech.current = this;
      this.#dom(hint, readout);
      this.#scene();
      this.#input();
    }
    #dom(hint, readout) {
      const m = this.mount;
      m.classList.add("mech");
      m.innerHTML = `<div class="mech-stage" tabindex="0" role="img"><canvas></canvas><div class="mech-over"><svg class="mech-leaders"></svg></div><div class="mech-panel" hidden></div></div><div class="mech-foot"><span class="mech-hint">${hint}</span><code class="mech-readout">${readout}</code></div>`;
      this.stage = m.querySelector(".mech-stage");
      this.canvas = m.querySelector("canvas");
      this.readoutEl = m.querySelector(".mech-readout");
      this.over = m.querySelector(".mech-over"); this.leaders = m.querySelector(".mech-leaders"); this.panel = m.querySelector(".mech-panel"); this.stage.after(this.panel);
      this.infoDict = {}; this.labelList = []; this.labelSet = null; this.flowList = []; this.flowSet = null; this.selected = null; this.pickHandler = null;
    }

  // ---------- card ----------
  function card(mount, { fig = "Fig 1", title = "", keys = [], caption = "" }) {
    const m = typeof mount === "string" ? document.querySelector(mount) : mount;
    const head = document.createElement("div"); head.className = "mech-head";
    const dark = (document.documentElement.dataset.theme || "dark") === "dark";
    head.innerHTML = `<span>${fig}</span><b>${title}</b><button class="mech-theme" aria-label="Switch to ${dark ? "light" : "dark"} theme">${dark ? "Light" : "Dark"}</button>`;
    // The theme button flips data-theme on <html>, remembers the choice for this reader, and tells the scene to rebuild.
    head.querySelector("button").addEventListener("click", () => { const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next; try { localStorage.setItem("mech-theme", next); } catch (e) {} global.dispatchEvent(new Event("mech-theme")); });
    const k = document.createElement("div"); k.className = "mech-keys"; k.innerHTML = keys.map((x) => `<span class="k-${x.mark}">${x.label}</span>`).join("");
    const c = document.createElement("p"); c.className = "mech-cap"; c.textContent = caption;
    m.prepend(head); m.append(k, c);
    const fig3d = global.mech.current, F = (fig3d && fig3d.factList) || [];
    if (F.length) {
      const b = document.createElement("button"); b.className = "mech-theme"; b.textContent = "Sources"; b.setAttribute("aria-expanded", "false"); head.append(b);
      const box = document.createElement("div"); box.className = "mech-sources"; box.hidden = true;
      const word = { sourced: "from the source", model: "worked out by the model", assumed: "typical value, assumed", illustrative: "made up for illustration" };
      box.innerHTML = "<b>Where the facts come from</b><ul>" + F.map((f) => `<li>${f.claim} <i>${word[f.status] || f.status}</i>${f.url ? ` <a href="${f.url}" target="_blank" rel="noopener">${f.source || "source"}</a>` : f.source ? ` <span>${f.source}</span>` : ""}</li>`).join("") + "</ul>";
      m.append(box); b.addEventListener("click", () => { box.hidden = !box.hidden; b.setAttribute("aria-expanded", String(!box.hidden)); });
    }
  }

  const CSS = `

    F.tube([[0, 0, 6.4], [0.3, 0, 8.5], [0, 0.2, 11], [0, 0, M.Z0 - 0.4]], 0.32, { group: flower, color: 0x4f8a3c, mat: "rubber", tag: "obj", info: "flower" });
    F.add(new T3.SphereGeometry(1.7, 10, 6), { group: flower, at: [0.3, 0.9, 9.0], rot: [0.5, 0.2, 0.9], color: 0x5e9a46, mat: "rubber", tag: "obj", info: "flower", edges: false }).scale.set(1, 0.35, 0.6);
    F.lathe([[0, 0], [2.4, 0], [3.0, 3.2], [3.2, 3.6], [0, 3.6]], { n: 28 }, { group: flower, color: 0xb46a45, mat: "rubber", tag: "obj", info: "flower", at: [0, 0, 3.2] });
    for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2, pm = F.add(new T3.SphereGeometry(1, 14, 8), { group: flower, at: [0.15, 1.9 * Math.cos(a), M.Z0 + 1.9 * Math.sin(a)], rot: [a - Math.PI / 2, 0, 0], color: 0xfbfaf4, mat: "rubber", tag: "obj", info: "flower", edges: false }); pm.scale.set(0.35, 0.9, 1.45); }
    F.add(new T3.SphereGeometry(1.0, 18, 12), { group: flower, at: [0, 0, M.Z0], color: 0xf2b21b, mat: "rubber", tag: "obj", info: "flower", edges: false }).scale.set(0.7, 1, 1);
    // a little table under the flower pot, so it stands on something
    const table = F.box({ w: 11, d: 11, h: 3.2, r: 1.2 }, { mat: "castAl", tag: "obj", info: "flower", group: flower, at: [0, 0, 0] }); void table;
    // light: a see-through cone from the flower into the eye, and 8 rays on its surface
    const beamMat = (o) => Object.assign({ group: eye, color: LIGHT, edges: false, shadow: false, side: "double" }, o);
    const beamOut = F.add(new T3.BufferGeometry(), beamMat({ tag: "beam", info: "light" })), beamIn = F.add(new T3.BufferGeometry(), beamMat({ tag: "beamIn", info: "light" })), beamBy = F.add(new T3.BufferGeometry(), beamMat({ tag: "beyond", info: "light" }));
    for (const m of [beamOut, beamIn, beamBy]) { m.material.emissive.setHex(LIGHT); m.material.emissiveIntensity = 0.55; }
    const RN = 8, rays = []; for (let k = 0; k < RN; k++) { const a = k / RN * Math.PI * 2, segs = [];
      for (let j = 0; j < 6; j++) { const m = F.link([0, 0, 0], [1, 0, 0], { w: 0.09, d: 0.09, r: 0.04 }, { group: eye, color: LIGHT, tag: j === 0 ? "rayExt" : j === 5 ? "beyond" : "ray", info: "light", edges: false, shadow: false }); m.material.emissive.setHex(LIGHT); m.material.emissiveIntensity = 0.8; segs.push(m); }
      rays.push({ a, segs }); }
    const dot = F.add(new T3.SphereGeometry(0.32, 16, 10), { group: eye, color: 0xfff1b0, tag: "dot", info: "light", edges: false, shadow: false }); dot.material.emissive.setHex(LIGHT);
    const spot = F.cyl({ r: 1, h: 0.08, n: 32, axis: "x" }, { group: eye, color: 0xffe27a, tag: "spot", info: "spot", edges: false, shadow: false }); spot.material.emissive.setHex(LIGHT); spot.material.emissiveIntensity = 0.9;

    // ---------- what each part is ----------
    F.describe({
      cornea: { name: "Cornea", what: "The clear dome at the front of the eye.", does: "It does most of the bending of light.", how: "The change from air to cornea is the biggest step light meets in the eye, and the curved surface bends it inward.", fact: "About 43 of the eye's 60 dioptres. A dioptre measures how strongly something bends light.", src: ["power", "corneaSize"] },
      iris: { name: "Iris", what: "The coloured ring behind the cornea.", does: "It sets how much light gets in.", how: "Muscles in it make the hole in its middle, the pupil, wider or narrower.", fact: "The pupil is typically about 4 mm across, and can range from 2 to 8 mm.", src: ["pupil", "retina"] },
      lens: { name: "Lens", what: "A clear, flexible disc behind the iris.", does: "It fine-tunes the focus for near and far things.", how: "When it bulges, its surfaces curve more and it bends light more strongly.", fact: "About 10 mm across and 4 mm thick. Relaxed, it gives about 19 dioptres.", src: ["power", "accom", "lensGrad", "legrand", "shape"] },
      ciliary: { name: "Ciliary muscle", what: "A ring of muscle around the lens.", does: "It tells the lens to bulge or flatten.", how: "When it contracts, the ring gets smaller, the fibres go slack and the lens springs rounder. When it relaxes, the fibres pull the lens flat.", src: ["accom", "scene"] },
      zonule: { name: "Zonule fibres", what: "Thousands of fine fibres that hold the lens in place.", does: "They pull on the edge of the lens.", how: "Tight fibres stretch the lens flat. Slack fibres let it round up.", src: ["accom", "lensGrad", "scene"] },
      retina: { name: "Retina", what: "A thin layer lining the back of the eye.", does: "It turns light into signals for the brain.", how: "Light-sensitive cells respond when light lands on them. A sharp picture needs each point of light to land on one spot.", src: ["retina", "retinaPos"] },
      fovea: { name: "Fovea", what: "A small spot in the middle of the macula, at the back of the retina.", does: "It gives the sharpest sight.", how: "It has the most cone cells. Your eye turns so that what you look at lands here.", src: ["fovea", "scene"] },
      sclera: { name: "White of the eye", what: "The tough outer wall of the eyeball.", does: "It keeps the eye's round shape.", fact: "The eye is about 24 mm from front to back.", src: ["size", "scene"] },
      nerve: { name: "Optic nerve", what: "A cable of nerve fibres at the back of the eye.", does: "It carries the signals from the retina to the brain.", src: ["retina"] },
      flower: { name: "Flower", what: "What the eye is looking at.", does: "Every point on it sends light out in all directions. The figure follows the light from one point.", src: ["scene"] },
      light: { name: "Light rays", what: "Light from the centre of the flower that gets through the pupil.", does: "It spreads out on its way to the eye. The eye bends it back together.", how: "Where the rays meet is worked out from the shape and the material of each surface.", src: ["trace", "legrand"] },
      spot: { name: "Blur spot", what: "The patch of light where the rays hit the retina.", does: "Small means sharp. Large means blurry.", how: "If the rays have not met yet, or met already, they land as a disc, not a point.", src: ["trace"] },
    });
    for (const k of ["cornea", "iris", "sclera", "flower"]) F.label(k, { set: "whole" });
    for (const k of ["cornea", "iris", "lens", "retina", "nerve", "light"]) F.label(k, { set: "inside" });
    for (const k of ["lens", "ciliary", "zonule", "retina", "cornea"]) F.label(k, { set: "focus" });
    const LM = F.label("light", { set: "focus", text: "Rays meet here", on: dot });
    F.label("flower", { set: "inside" });

    // ---------- inset: what the retina gets. The blur grows with the blur spot from the model. ----------
    const inset = document.createElement("canvas"), IW = 150, IH = 150, dpr = Math.min(devicePixelRatio || 1, 2); inset.width = IW * dpr; inset.height = IH * dpr;
    inset.style.cssText = "position:absolute;left:8px;top:8px;width:" + IW + "px;height:" + IH + "px;border:1px solid var(--m-rule);border-radius:8px;background:var(--m-card);pointer-events:none;display:none"; F.stage.appendChild(inset);
    const g2 = inset.getContext("2d"), INK = DARK ? "#e8e8e8" : "#1a1a1a", MUTED = DARK ? "#8a8a8a" : "#6b6b70";
    function drawInset(blurMM, sharp) {
      g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.clearRect(0, 0, IW, IH); g2.font = "11px -apple-system,Segoe UI,sans-serif"; g2.textAlign = "center"; g2.textBaseline = "middle";
      g2.fillStyle = MUTED; g2.fillText("What the retina gets", IW / 2, 13);
      const px = sharp ? 0 : Math.min(14, 2 + blurMM * 22); g2.save(); g2.filter = px ? "blur(" + px.toFixed(1) + "px)" : "none";
      const cx = IW / 2, cy = 76; g2.fillStyle = "#4f8a3c"; g2.fillRect(cx - 1.5, cy, 3, 46);
      for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; g2.save(); g2.translate(cx + Math.cos(a) * 17, cy + Math.sin(a) * 17); g2.rotate(a); g2.fillStyle = DARK ? "#f4f2ea" : "#ffffff"; g2.strokeStyle = "#c9c6bb"; g2.lineWidth = 1; g2.beginPath(); g2.ellipse(0, 0, 13, 6, 0, 0, Math.PI * 2); g2.fill(); g2.stroke(); g2.restore(); }
      g2.fillStyle = "#f2b21b"; g2.beginPath(); g2.arc(cx, cy, 8, 0, Math.PI * 2); g2.fill(); g2.restore();
      g2.fillStyle = sharp ? INK : "#c0503f"; g2.font = "600 12px -apple-system,Segoe UI,sans-serif"; g2.fillText(sharp ? "Sharp" : "Blurry", IW / 2, IH - 11);
    }

    // ---------- running ----------
    const P = (x, r, a) => [x, -r * Math.sin(a), r * Math.cos(a)];
    const cone = (prof) => { if (prof.length < 2) return new T3.BufferGeometry(); const g = new T3.LatheGeometry(prof.map((p) => new T3.Vector2(Math.max(Math.abs(p[0]), 1e-3), p[1])), 48); g.rotateZ(-Math.PI / 2); return g; };
    const setGeo = (m, g) => { m.geometry.dispose(); m.geometry = g; };
    let lastS = -1, lastCil = -1, lastKey = "", info = null;
    function pose() {
      const key = state.d.toFixed(2) + "|" + state.s.toFixed(5) + "|" + state.hold; if (key === lastKey) return; lastKey = key;
      const d = state.d, s = state.s, xo = FX(d), tr = M.trace(s, d, M.h), L = M.lens(s);
      flower.position.x = xo;
      // lens and ciliary ring shape
      if (Math.abs(s - lastS) > 1e-4) { setGeo(lens, lensGeo(s)); lastS = s; }
      if (Math.abs(s - lastCil) > 0.01) { lastCil = s; for (const half of ["far", "near"]) { const [shell, c1, c2] = cil[half], prof = cilProf(s), phi0 = half === "far" ? Math.PI : 0;
        const g = new T3.LatheGeometry(prof.concat([prof[0]]).map((p) => new T3.Vector2(p[0], p[1])), 64, phi0, Math.PI); g.rotateZ(-Math.PI / 2); g.computeVertexNormals(); setGeo(shell, g);
        const sh = new T3.Shape(prof.map((p) => new T3.Vector2(p[1], p[0]))); const ga = new T3.ShapeGeometry(sh); ga.rotateX(Math.PI / 2); setGeo(c1, ga); const gb = new T3.ShapeGeometry(sh); gb.rotateX(-Math.PI / 2); setGeo(c2, gb); } }
      // fibres: fixed length, so a fibre sags forward when its ends come closer
      const eq = M.equator(s), ex = L.x + M.sag(L.R1, eq), ap = M.cilApex(s), span = ap - eq, sagb = Math.sqrt(Math.max(0, (M.zonRest / 2) ** 2 - (span / 2) ** 2));
      for (const z of zon) { const a = P(ex, eq, z.a), b = P(4.9, ap, z.a), mid = P((ex + 4.9) / 2 - sagb, (eq + ap) / 2, z.a); z.m[0].setEnds(a, mid); z.m[1].setEnds(mid, b); }
      // rays: bend points on the real curved surfaces, heights from the trace
      const S = M.surfaces(s), xs = tr.pts.map(([x, y], i) => x + (i === 3 ? -M.sag(S[i].R, y) : M.sag(S[i].R, y))), ys = tr.pts.map((p) => p[1]);
      const yRet = tr.y + tr.u * (M.L - tr.x), xRet = M.L - M.sag(M.Rs - M.wall, yRet), behind = tr.focus > M.L, xF = Math.min(tr.focus, M.L + 14);
      for (const r of rays) {

      const inProf = [[ys[0], xs[0]], [ys[1], xs[1]], [ys[2], xs[2]], [ys[3], xs[3]]]; if (!behind) inProf.push([0, tr.focus]); inProf.push([yRet, xRet]);
      setGeo(beamIn, cone(inProf)); setGeo(beamBy, behind ? cone([[yRet, xRet], [0, xF]]) : cone([[0.05, xRet], [0, xRet + 0.05]]));
      dot.position.set(behind ? xF : tr.focus, 0, 0);
      const blur = Math.abs(yRet) * M.pupil / M.h; spot.position.x = xRet - 0.15; spot.scale.set(1, Math.max(blur, 0.12), Math.max(blur, 0.12));
      const miss = tr.focus - M.L, sharp = Math.abs(miss) < 0.05;
      LM.text(sharp ? "Rays meet on the retina" : behind ? "Rays would meet here" : "Rays meet too soon");
      const word = s < 0.03 ? "relaxed and flat" : s >= M.sMax - 1e-3 ? "as round as it gets" : "rounder (" + Math.round(s / M.sMax * 100) + "% of its range)";
      info = { d, s, miss, sharp, blur, word }; drawInset(2 * blur, sharp);
      F.readout("Flower " + fmtD(d) + " · lens " + word + (state.hold ? ", held" : "") + " · " + (sharp ? "rays meet on the retina: sharp" : "rays meet " + f1(Math.abs(miss)) + " mm " + (behind ? "behind" : "in front of") + " the retina: blur spot " + f2(2 * blur) + " mm"));
    }
    F.onFrame((dt) => {
      if (state.stage === 2 && state.sweep && !lessonOn) { state.clock += dt; state.d = sweepAt(state.clock); syncSlider(); }
      if (!state.hold) { const want = M.want(state.d); state.s = F.snap || F.reduced ? want : state.s + (want - state.s) * (1 - Math.exp(-dt / M.tau)); }
      pose();
    });

    // ---------- views ----------
    const box = (a, b) => new T3.Box3(new T3.Vector3(...a), new T3.Vector3(...b));
    const NEAR = ["wallN", "retinaN", "corneaN", "irisN", "cilN", "zonN"];
    function show(v) {
      const cut = v.cut ? 0 : 1; for (const t of NEAR) F.ghost(t, cut);
      if (v.cut) F.ghost("wallN", 0.05);
      F.ghost("cornea", 0.35); F.ghost("corneaN", v.cut ? 0 : 0.35); F.ghost("lens", 0.55);
      F.ghost("beam", 0.22); F.ghost("rayExt", 1); F.ghost("beamIn", v.cut ? 0.2 : 0); F.ghost("ray", v.cut ? 1 : 0);
      F.ghost("beyond", v.cut ? 0.45 : 0); F.ghost("dot", v.cut ? 1 : 0); F.ghost("spot", v.cut ? 1 : 0);
      F.labels(state.labels ? v.set : null); F.focus(v.box, { azimuth: v.az, elevation: v.el, pad: v.pad || 1.05 });
      sl.hidden = slLab.hidden = holdB.hidden = !v.slider; inset.style.display = v.inset ? "block" : "none"; lastKey = ""; F.run();
    }
    const STAGES = [
      { name: "The eye", set: "whole", hint: "An eye looking at a flower. Light from the flower goes in through the black hole in the middle, the pupil.", box: box([-44, -13, 0], [27, 13, 28]), az: -50, el: 16, d: 1000 },
      { name: "Inside", set: "inside", cut: true, hint: "Cut in half. Light from the flower bends at the cornea, bends again at the lens, and the rays meet in one point on the retina.", box: box([-44, -13, 0], [27, 13, 28]), az: -4, el: 12, d: 1000 },
      { name: "Near and far", set: "focus", cut: true, slider: true, hint: "Move the slider. When the flower comes close, the muscle ring tightens and the lens bulges, so the rays meet on the retina again. Closer than about 10 cm it cannot bulge enough, and the rays miss.", box: box([-7, -12, 1], [35, 12, 27]), az: -2, el: 10, inset: true },
    ];

    // ---------- controls and lesson ----------
    const bar = document.createElement("div"); bar.className = "mech-controls";
    bar.innerHTML = STAGES.map((s, i) => `<button data-stage="${i}">${i + 1} ${s.name}</button>`).join("") +
      `<span class="sp"></span><span data-c="d">Flower distance</span><input data-c="d" type="range" min="0" max="1000" step="1" aria-label="Distance of the flower, 6 cm to 20 m"><button data-t="hold" aria-pressed="false">Hold the lens</button>` +
      `<span class="sp"></span><button data-t="labels" aria-pressed="${state.labels}">Labels</button><button data-t="lesson">Lesson</button><button data-t="style">${REAL ? "Line view" : "Real view"}</button>`;

    const toSl = (d) => Math.round(Math.log(d / M.dMin) / Math.log(M.dMax / M.dMin) * 1000), fromSl = (v) => M.dMin * Math.pow(M.dMax / M.dMin, v / 1000);
    function syncSlider() { sl.value = toSl(state.d); }
    sl.addEventListener("input", () => { F.touch(); state.sweep = false; state.d = fromSl(+sl.value); F.run(); });
    const setHold = (on) => { state.hold = on; holdB.setAttribute("aria-pressed", on); };
    function setStage(i, quiet) { if (!quiet) F.touch(); state.stage = ((i % STAGES.length) + STAGES.length) % STAGES.length; const S = STAGES[state.stage];
      if (S.d) { state.d = S.d; setHold(false); } if (state.stage === 2) { state.sweep = true; state.clock = 0; setHold(false); } show(S); hintEl.textContent = S.hint; syncSlider();
      bar.querySelectorAll("[data-stage]").forEach((b, k) => b.setAttribute("aria-pressed", k === state.stage)); }
    let lessonOn = false;
    const step = (d, s, hold, extra) => () => { lessonOn = true; state.stage = 2; show(Object.assign({}, STAGES[2], extra)); state.d = d; setHold(hold); state.s = s === null ? M.want(d) : s; syncSlider(); bar.querySelectorAll("[data-stage]").forEach((b) => b.setAttribute("aria-pressed", "false")); };
    const lesson = F.lesson([
      { title: "1. Far away: a relaxed lens", text: "Light from a far flower arrives with its rays almost side by side. The cornea and the flat, relaxed lens bend them just enough to meet on the retina.", go: step(20000, null, false) },
      { title: "2. Bring it close, keep the lens flat", text: "Now the flower is 25 cm away, so its rays spread out more. With the lens held flat, they cannot meet in time. They would meet behind the retina, and the retina gets a blur spot.", go: step(250, 0, true) },
      { title: "3. The lens bulges", text: "The ring of muscle tightens. The fibres go slack, and the lens springs rounder and thicker. A rounder lens bends light more, so the rays meet on the retina again.", go: step(250, null, false) },
      { title: "4. Too close", text: "At 7 cm the lens is as round as it gets, and the rays still meet behind the retina. A young adult can focus down to about 10 cm. After about 40 the lens loses its range, which is why people need reading glasses.", go: step(70, null, false) },
    ], { onClose: () => { lessonOn = false; setStage(0, true); } });
    bar.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; F.touch(); const t = b.dataset.t;
      if (b.dataset.stage) setStage(+b.dataset.stage); else if (t === "style") { state.style = REAL ? "line" : "real"; start(); } else if (t === "hold") { setHold(!state.hold); state.sweep = false; } else if (t === "labels") { state.labels = !state.labels; b.setAttribute("aria-pressed", state.labels); F.labels(state.labels ? STAGES[state.stage].set : null); } else if (t === "lesson") lesson.open(0); });
    F.stage.addEventListener("keydown", (e) => { if (e.key >= "1" && e.key <= String(STAGES.length)) setStage(+e.key - 1); });
    F.onPress = () => setStage(state.stage + 1);
    F.tour(() => setStage(state.stage + 1, true), { idle: 14, every: 13 });

    // ---------- card ----------
    mech.card("#fig", {
      fig: "Fig 10", title: "How the eye focuses near and far",
      keys: [{ mark: "lit", label: "Click a part or its label to learn what it does" }, { mark: "mid", label: "Keys 1 to 3 change the view. Drag to orbit. Sources lists every claim." }],
      caption: "The eye bends light twice, at the cornea and at the lens, so that the light from each point of what you look at meets in one point on the retina. For a near object the lens bulges and bends light more. The eye and every ray come from the Le Grand schematic eye, a standard textbook model with a " + f1(M.power(0)) + " dioptre eye, " + f1(M.L) + " mm long. The rays are traced with the simple (paraxial) method, which is exact near the axis. The figure follows light from one point of the flower only. Simplified: the flower and its distance are not to scale, and the distance is drawn squeezed so it fits, so the rays outside the eye look more spread out than they are. The way the lens changes shape is drawn, not measured. The fovea is drawn on the axis; in a real eye it sits about 5 degrees to the side. Focusing is slowed down to about half a second. The light shows the path of the rays, not their speed.",
    });
    window.fig = F; window.setStage = setStage; window.state = state; window.model = M;
    setStage(state.stage, true); F.fit(true);
  }
  addEventListener("mech-theme", start);
  start();
})();
