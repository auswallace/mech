<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a laser line profiler measures height</title>
<style>
:root{--m-paper:#121212;--m-ink:#e8e8e8;--m-muted:#8a8a8a;--m-card:#161616;--m-rule:#2a2a2a;--m-lit:#fff;--m-mid:#6a6a6a}
[data-theme=light]{--m-paper:#f7f7f5;--m-ink:#1a1a1a;--m-muted:#6b6b70;--m-card:#fff;--m-rule:#e2e2e0;--m-lit:#000;--m-mid:#9a9a9f}
body{margin:0;background:var(--m-paper);color:var(--m-ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.mech{max-width:680px;margin:28px auto;background:var(--m-card);border:1px solid var(--m-rule);border-radius:12px;padding:14px 16px 12px}
.mech-head,.mech-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--m-muted)}
.mech-head b{color:var(--m-ink);font-weight:500;margin-left:auto}
.mech-theme{font:inherit;font-size:11px;color:var(--m-muted);background:transparent;border:1px solid var(--m-rule);border-radius:6px;padding:2px 8px;margin-left:10px;cursor:pointer}
.mech-stage{outline:none;cursor:grab;margin:6px 0;border-radius:8px}
.mech-stage:active{cursor:grabbing}.mech-stage:focus-visible{box-shadow:0 0 0 2px var(--m-muted)}
.mech-stage canvas{display:block;width:100%;height:auto}
.mech-foot code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--m-ink)}
.mech-keys{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 4px;font-size:12px;color:var(--m-muted)}
.mech-keys span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--m-mid)}
.mech-keys .k-lit::before{background:var(--m-lit)}
.mech-cap{font-size:13px;color:var(--m-muted);margin:6px 0 0}
.mech-controls{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:2px 0 8px;font-size:12px;color:var(--m-muted)}
.mech-controls button{font:inherit;color:var(--m-ink);background:transparent;border:1px solid var(--m-rule);border-radius:7px;padding:5px 10px;cursor:pointer}
.mech-controls button[aria-pressed=true]{background:var(--m-ink);color:var(--m-card);border-color:var(--m-ink)}
.mech-controls input[type=range]{flex:1;min-width:120px;accent-color:var(--m-ink)}
.mech-controls .sp{flex-basis:100%;height:0}
.mech-stage{position:relative}
.mech-over{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mech-leaders{position:absolute;inset:0;width:100%;height:100%}
.mech-leaders path{fill:none;stroke:var(--m-muted);stroke-width:1}.mech-leaders circle{fill:var(--m-ink)}
.mech-label{position:absolute;transform:translateY(-50%);font-size:11.5px;line-height:1.2;white-space:nowrap;color:var(--m-ink);background:var(--m-card);border:1px solid var(--m-rule);border-radius:5px;padding:2px 6px}
.mech-label.pin{transform:translate(-50%,-50%);background:transparent;border:0;font-weight:500;text-shadow:0 0 4px var(--m-card),0 0 4px var(--m-card)}
.mech-label.pin.box{background:var(--m-card);border:1px solid var(--m-rule);font-size:12.5px;padding:3px 8px;text-shadow:none}
.mech-panel{margin:0 0 8px;background:var(--m-card);border:1px solid var(--m-rule);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.45;color:var(--m-muted)}
.mech-label.can{pointer-events:auto;cursor:pointer}.mech-label.can:hover{border-color:var(--m-ink)}
.mech-panel .row{margin-top:3px}.mech-panel u{text-decoration:none;color:var(--m-ink);font-weight:600;margin-right:6px}
.mech-panel small{display:block;margin-top:6px;font-size:11px}.mech-panel small i{font-style:normal;border:1px solid var(--m-rule);border-radius:4px;padding:0 5px;margin-right:5px;color:var(--m-ink)}
.mech-panel b{display:block;color:var(--m-ink);font-weight:600;font-size:13px;margin-bottom:2px}.mech-panel span{display:block}.mech-panel em{display:block;font-style:normal;color:var(--m-ink);margin-top:4px}
.mech-lesson{border:1px solid var(--m-rule);border-radius:9px;padding:9px 11px;margin:0 0 8px;font-size:13px}
.mech-lesson .row{display:flex;align-items:center;gap:8px}.mech-lesson b{font-weight:600}.mech-lesson .n{color:var(--m-muted);font-size:12px;margin-right:auto}
.mech-lesson button{font:inherit;font-size:12px;color:var(--m-ink);background:transparent;border:1px solid var(--m-rule);border-radius:7px;padding:4px 10px;cursor:pointer}
.mech-lesson p{margin:6px 0 0;color:var(--m-muted)}
.mech-sources{border-top:1px solid var(--m-rule);margin-top:10px;padding-top:8px;font-size:12px;color:var(--m-muted)}
.mech-sources b{color:var(--m-ink);font-weight:600}.mech-sources ul{margin:6px 0 0;padding-left:18px}.mech-sources li{margin:3px 0}
.mech-sources i{font-style:normal;border:1px solid var(--m-rule);border-radius:4px;padding:0 5px;font-size:11px;margin:0 4px}.mech-sources a{color:var(--m-ink)}</style>
</head>
<body>
<div id="fig"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* mech: isometric technical figures on a real 3D core.
   World: x right, y toward the viewer, z up. Units are millimetres of the real thing, or whatever you like.

(function (global) {
  const T = global.THREE;
  const THEMES = {

  };
  const GRADIENT = [0.5, 0.68, 0.85, 1.0];

  const MATS = {
    castAl:   { color: 0xb4b8bc, metal: 0.85, rough: 0.58, tone: "hi" },
    machined: { color: 0xdfe2e5, metal: 1.0, rough: 0.22, tone: "hi", lit: true },
    steel:    { color: 0x8e9298, metal: 1.0, rough: 0.36, tone: "mid" },
    darkSteel:{ color: 0x34373c, metal: 0.9, rough: 0.48, tone: "mid" },
    iron:     { color: 0x5a4a41, metal: 0.75, rough: 0.62, tone: "mid" },
    chrome:   { color: 0xffffff, metal: 1.0, rough: 0.07, tone: "hi" },
    brass:    { color: 0xb08d48, metal: 1.0, rough: 0.3, tone: "mid" },
    plastic:  { color: 0x17181b, metal: 0.0, rough: 0.52, tone: "lo" },
    rubber:   { color: 0x0d0d0e, metal: 0.0, rough: 0.92, tone: "lo" },
    glass:    { color: 0x05080b, metal: 0.6, rough: 0.05, tone: "lo", env: 1.4 },
    paint:    { color: 0x1b3657, metal: 0.35, rough: 0.38, clearcoat: 1, tone: "hi" },
    flat:     { color: 0x808080, metal: 0.05, rough: 0.55, tone: "mid" },
    concrete: { color: 0xaeaba3, metal: 0.0, rough: 0.9, tone: "hi" },
    light:    { color: 0xffffff, metal: 0, rough: 0.3, emissive: 0xffffff, tone: "hi", lit: true },
  };

  function gradientMap() {
    const data = new Uint8Array(GRADIENT.map((v) => Math.round(v * 255)));
    const tex = new T.DataTexture(data, GRADIENT.length, 1, T.LuminanceFormat);
    tex.minFilter = tex.magFilter = T.NearestFilter;
    tex.needsUpdate = true;
    return tex;
  }

  // ---------- geometry helpers ----------
  function roundedRect(w, d, r) {
    r = Math.min(r, w / 2, d / 2);
    const s = new T.Shape();
    s.moveTo(-w / 2 + r, -d / 2);
    s.lineTo(w / 2 - r, -d / 2); s.absarc(w / 2 - r, -d / 2 + r, r, -Math.PI / 2, 0, false);
    s.lineTo(w / 2, d / 2 - r); s.absarc(w / 2 - r, d / 2 - r, r, 0, Math.PI / 2, false);
    s.lineTo(-w / 2 + r, d / 2); s.absarc(-w / 2 + r, d / 2 - r, r, Math.PI / 2, Math.PI, false);
    s.lineTo(-w / 2, -d / 2 + r); s.absarc(-w / 2 + r, -d / 2 + r, r, Math.PI, Math.PI * 1.5, false);
    return s;
  }
  // A rounded box standing on z=0, centred at origin in x,y. bevel adds a small chamfer on the top edge.
  function boxGeo({ w = 10, d = 10, h = 10, r = 0, bevel = 0, segments = 4 }) {
    const shape = roundedRect(w, d, r);
    const g = new T.ExtrudeGeometry(shape, { depth: h, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: segments });
    if (bevel > 0) g.translate(0, 0, bevel); // keep base on z=0 after the bevel
    g.computeVertexNormals();
    return g;
  }
  function cylGeo({ r = 5, h = 10, n = 32, axis = "z" }) {
    const g = new T.CylinderGeometry(r, r, h, n, 1, false);
    // CylinderGeometry is along y, centred. Rotate so it stands on z=0 (or lies along x / y).
    if (axis === "z") { g.rotateX(Math.PI / 2); g.translate(0, 0, h / 2); }
    else if (axis === "y") { g.translate(0, h / 2, 0); }
    else if (axis === "x") { g.rotateZ(-Math.PI / 2); g.translate(h / 2, 0, 0); }
    return g;
  }
  function tubeGeo(points, r = 1, { n = 10, bend = 2, closed = false } = {}) {
    const v = points.map((p) => new T.Vector3(p[0], p[1], p[2]));
    const curve = new T.CatmullRomCurve3(v, closed, "centripetal", 0.5);
    return new T.TubeGeometry(curve, Math.max(8, points.length * 12 * bend), r, n, closed);
  }
  // A side profile in the x-z plane, extruded across y. points: [x,z] or { arc:[cx,cz,r,a0,a1,clockwise] }.
  function profileGeo(points, depth, yCenter = 0) {
    const s = new T.Shape(); let first = true;
    for (const p of points) { if (p.arc) s.absarc(...p.arc); else if (first) { s.moveTo(p[0], p[1]); first = false; } else s.lineTo(p[0], p[1]); }
    const g = new T.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 20 });
    g.rotateX(Math.PI / 2); g.translate(0, yCenter + depth / 2, 0);
    g.computeVertexNormals();
    return g;
  }

  // Toothed wheel for a chain or a gear train. Pitch radius = pitch / (2 sin(pi / teeth)). A roller sits in the gap at angle 0.
  function gearGeo({ teeth, pitch, thick = 2, hole = 0, axis = "z", depth = 0.3 }) {
    const R = pitch / (2 * Math.sin(Math.PI / teeth)), rr = R - pitch * depth, rt = R + pitch * depth * 0.9, da = (Math.PI * 2) / teeth, s = new T.Shape();
    for (let i = 0; i < teeth; i++) for (const [f, r] of [[0.24, rr], [0.41, rt], [0.59, rt], [0.76, rr]]) { const a = (i + f) * da, x = r * Math.cos(a), y = r * Math.sin(a); i || f > 0.3 ? s.lineTo(x, y) : s.moveTo(x, y); }
    s.closePath();
    if (hole > 0) { const h = new T.Path(); h.absarc(0, 0, hole, 0, Math.PI * 2, true); s.holes.push(h); }
    const g = new T.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false, curveSegments: 24 }); g.translate(0, 0, -thick / 2);
    if (axis === "y") g.rotateX(Math.PI / 2); else if (axis === "x") g.rotateY(Math.PI / 2);
    g.userData.pitchRadius = R; return g;
  }
  const pitchRadius = (teeth, pitch) => pitch / (2 * Math.sin(Math.PI / teeth));
  // Path of a chain, belt or cable round a closed loop of wheels, in the x-z plane.
  // wheels: [{ c: [x, z], r, s: +1 | -1, y }]. s is the turning sense seen with x to the right and z up: +1 anticlockwise, -1 clockwise.
  // Returns { length, at(distance) -> { x, y, z, ang }, arcs: [length on each wheel] }.
  function wrapPath(wheels) {
    const n = wheels.length, tan = [], seg = [];
    for (let i = 0; i < n; i++) {
      const A = wheels[i], B = wheels[(i + 1) % n], D = [B.c[0] - A.c[0], B.c[1] - A.c[1]], d = Math.hypot(D[0], D[1]), k = B.r * B.s - A.r * A.s;
      const pd = Math.atan2(D[1], D[0]), ac = Math.acos(Math.max(-1, Math.min(1, -k / d)));
      for (const sg of [1, -1]) { const q = [Math.cos(pd + sg * ac), Math.sin(pd + sg * ac)], u = [-q[1], q[0]], L = D[0] * u[0] + D[1] * u[1]; if (L > 0) { tan.push({ a: [A.c[0] + A.r * A.s * q[0], A.c[1] + A.r * A.s * q[1]], b: [B.c[0] + B.r * B.s * q[0], B.c[1] + B.r * B.s * q[1]], L, u }); break; } }
    }
    let length = 0; const arcs = [];
    for (let i = 0; i < n; i++) {
      const t = tan[i], j = (i + 1) % n, W = wheels[j], A = wheels[i];
      seg.push({ line: true, from: length, len: t.L, t, ya: A.y || 0, yb: W.y || 0 }); length += t.L;
      const a0 = Math.atan2(t.b[1] - W.c[1], t.b[0] - W.c[0]), o = tan[j].a, a1 = Math.atan2(o[1] - W.c[1], o[0] - W.c[0]);
      const sweep = (((a1 - a0) * W.s) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      seg.push({ from: length, len: sweep * W.r, a0, sweep, W }); arcs[j] = sweep * W.r; length += sweep * W.r;
    }
    const at = (dist) => {
      dist = ((dist % length) + length) % length; let g = seg[seg.length - 1];
      for (const q of seg) if (dist < q.from + q.len) { g = q; break; }
      const f = g.len ? (dist - g.from) / g.len : 0;
      if (g.line) return { x: g.t.a[0] + g.t.u[0] * g.len * f, z: g.t.a[1] + g.t.u[1] * g.len * f, y: g.ya + (g.yb - g.ya) * f, ang: Math.atan2(g.t.u[1], g.t.u[0]) };
      const a = g.a0 + g.W.s * g.sweep * f; return { x: g.W.c[0] + g.W.r * Math.cos(a), z: g.W.c[1] + g.W.r * Math.sin(a), y: g.W.y || 0, ang: a + g.W.s * Math.PI / 2 };
    };
    return { length, at, arcs };
  }
  // Point on a hop from a to b: t from 0 to 1, lifted by `lift` in the middle. For messages that travel between stations.
  const hop = (a, b, t, lift = 0) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t + lift * Math.sin(Math.PI * t)];
  // Flat plate standing on z = 0 with rectangular holes: { w, d, h, holes: [{ x, y, w, d }] }.
  function plateGeo({ w, d, h, holes = [] }) {
    const s = new T.Shape(); s.moveTo(-w / 2, -d / 2); s.lineTo(w / 2, -d / 2); s.lineTo(w / 2, d / 2); s.lineTo(-w / 2, d / 2); s.closePath();
    for (const o of holes) { const p = new T.Path(); p.moveTo(o.x - o.w / 2, o.y - o.d / 2); p.lineTo(o.x - o.w / 2, o.y + o.d / 2); p.lineTo(o.x + o.w / 2, o.y + o.d / 2); p.lineTo(o.x + o.w / 2, o.y - o.d / 2); p.closePath(); s.holes.push(p); }
    return new T.ExtrudeGeometry(s, { depth: h, bevelEnabled: false });
  }
  // Round part from a profile of [radius, height] pairs, spun about an axis.
  function latheGeo(profile, { axis = "z", n = 36 } = {}) {
    const g = new T.LatheGeometry(profile.map((p) => new T.Vector2(Math.max(p[0], 0.0001), p[1])), n);
    if (axis === "z") g.rotateX(Math.PI / 2); else if (axis === "x") g.rotateZ(-Math.PI / 2);
    g.computeVertexNormals();
    return g;
  }
  function torusGeo({ R = 5, r = 0.5, axis = "z", n = 32 } = {}) {
    const g = new T.TorusGeometry(R, r, 10, n);
    if (axis === "x") g.rotateY(Math.PI / 2); else if (axis === "y") g.rotateX(Math.PI / 2);
    return g;
  }
  // Scroll housing (turbo or pump): a tube wound once round the axis x, growing from r0 to r1.
  function voluteGeo({ R = 3.5, r0 = 1.2, r1 = 2.5, squash = 1 } = {}) {
    const f = (u, v, t) => { const a = u * Math.PI * 1.96, b = v * Math.PI * 2, rt = r0 + (r1 - r0) * u, q = R + rt * Math.cos(b); t.set(rt * Math.sin(b) * squash, q * Math.cos(a), q * Math.sin(a)); };
    const g = new T.ParametricGeometry(f, 56, 14); g.computeVertexNormals(); return g;
  }
  // Closed cross-section of a rounded body: half width W, from z = zb to z = zt. exp 2 is an ellipse, 5 is a soft box.
  function superSection(W, zb, zt, exp = 4.5, count = 44) {
    const sp = (c) => Math.sign(c) * Math.pow(Math.abs(c), 2 / exp), zc = (zb + zt) / 2, hh = (zt - zb) / 2;
    return Array.from({ length: count }, (_, j) => { const a = (j / count) * Math.PI * 2; return [W * sp(Math.cos(a)), zc + hh * sp(Math.sin(a))]; });
  }
  // Interpolate rows of numbers (first column is x) with a Catmull-Rom spline. Returns `steps + 1` rows.
  function sweep(keys, steps = 48) {
    const n = keys.length, out = [];
    const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
    for (let s = 0; s <= steps; s++) {
      const f = (s / steps) * (n - 1), i = Math.min(n - 2, Math.floor(f)), t = f - i;
      const k = (d) => keys[Math.max(0, Math.min(n - 1, i + d))];
      out.push(keys[0].map((_, c) => cr(k(-1)[c], k(0)[c], k(1)[c], k(2)[c], t)));
    }
    return out;
  }
  // Skin a row of sections [{ x, pts: [[y, z], ...] }] into one smooth surface. filter(i, j, n) keeps or drops a panel.
  function loftGeo(sections, { filter, caps = true } = {}) {
    const n = sections[0].pts.length, pos = [], idx = [];
    sections.forEach((s) => s.pts.forEach((p) => pos.push(s.x, p[0], p[1])));
    for (let i = 0; i < sections.length - 1; i++) for (let j = 0; j < n; j++) {
      if (filter && !filter(i, j, n, sections[i].x)) continue;
      const a = i * n + j, b = i * n + ((j + 1) % n), c = (i + 1) * n + j, d = (i + 1) * n + ((j + 1) % n);
      idx.push(a, c, b, b, c, d);
    }
    if (caps && !filter) for (const [si, flip] of [[0, false], [sections.length - 1, true]]) {
      const s = sections[si], c = pos.length / 3, cy = s.pts.reduce((t, p) => t + p[0], 0) / n, cz = s.pts.reduce((t, p) => t + p[1], 0) / n;
      pos.push(s.x, cy, cz);
      for (let j = 0; j < n; j++) { const a = si * n + j, b = si * n + ((j + 1) % n); flip ? idx.push(c, a, b) : idx.push(c, b, a); }
    }
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    return g;
  }

  // ---------- the figure ----------
  const VERSION = "0.5";
  class Figure {
    constructor(mount, { theme = "dark", style = "line", width = 640, height = 420, azimuth = 40, elevation = 32, hint = "", readout = "" } = {}) {
      this.mount = typeof mount === "string" ? document.querySelector(mount) : mount;
      this.theme = THEMES[theme] ? theme : "dark";
      this.T = THEMES[this.theme];
      this.style = style === "real" ? "real" : "line"; this.lastInput = performance.now(); this.snap = false;
      this.width = width; this.height = height;
      this.azimuth = azimuth; this.elevation = elevation;
      this.parts = [];          // every mesh we made, with its tone
      this.updaters = [];       // per-frame fns (dt, t)
      this.channels = {};       // named scalars that ease toward a target: { v, to, tau }
      this.cut = null;          // clipping plane or null
      this.view = null; this.viewTo = null; this.focusBox = null;
      this.gradient = gradientMap();
      this.running = false; this.visible = false; this.last = 0; this.time = 0;
      this.reduced = global.matchMedia && global.matchMedia("(prefers-reduced-motion: reduce)").matches;
      global.mech.current = this;
      this.#dom(hint, readout);
      this.#scene();
      this.#input();
    }
    #dom(hint, readout) {
      const m = this.mount;
      m.classList.add("mech");
      m.innerHTML = `<div class="mech-stage" tabindex="0" role="img"><canvas></canvas><div class="mech-over"><svg class="mech-leaders"></svg></div><div class="mech-panel" hidden></div></div><div class="mech-foot"><span class="mech-hint">${hint}</span><code class="mech-readout">${readout}</code></div>`;
      this.stage = m.querySelector(".mech-stage");
      this.canvas = m.querySelector("canvas");
      this.readoutEl = m.querySelector(".mech-readout");
      this.over = m.querySelector(".mech-over"); this.leaders = m.querySelector(".mech-leaders"); this.panel = m.querySelector(".mech-panel"); this.stage.after(this.panel);
      this.infoDict = {}; this.labelList = []; this.labelSet = null; this.flowList = []; this.flowSet = null; this.selected = null; this.pickHandler = null;
    }
    #scene() {

        if (s.block) { r.setEnds(a, [a[0] + s.block * (c[0] - a[0]), a[1] + s.block * (c[1] - a[1]), a[2] + s.block * (c[2] - a[2])]); r.material.emissive.setHex(WARM); }

      const S7 = "one profile every " + (gap < 1 ? f2(gap) : f1(gap)) + " mm";
      let txt = "";
      if (state.build !== null) { const c = M.comps[state.build]; txt = state.build >= M.comps.length ? "all " + M.comps.length + " parts in place · laser on · first profile" : "part " + (state.build + 1) + " of " + M.comps.length + ": " + c.name + (c.links.length ? " · connects to " + c.links.map((k) => nm[k].toLowerCase()).join(", ") : " · everything mounts on it"); }
      else if (state.view === "asm") { const pos = state.asm / 100 * M.N, j = Math.min(M.N, Math.floor(pos) + 1), c = M.comps[j]; txt = state.asm >= 100 ? "assembled · " + M.comps.length + " parts in place" : "fitting part " + (j + 1) + " of " + M.comps.length + ": " + c.name + " · connects to " + c.links.map((k) => nm[k].toLowerCase()).join(", "); }
      else if (state.view === "apart") txt = M.comps.length + " parts, in the order of the light path · " + lz;
      else if (flat) txt = "surface " + f1(h) + " mm · line at row " + Math.round(M.row(u)) + " of " + M.rows + " · height from that row " + f1(M.heightOf(u)) + " mm · field of view here " + f1(M.fovModel(h)) + " mm · one point every " + f1(M.fovModel(h) / M.points * 1000) + " µm";
      else if (state.view === "spec") txt = "clearance " + M.CD + " mm · range " + M.MR + " mm · field of view " + M.fovNear + " to " + M.fovFar + " mm · " + M.points + " points: one every " + f1(M.fovNear / M.points * 1000) + " µm (near) to " + f1(M.fovFar / M.points * 1000) + " µm (far)";
      else if (state.mode === "scan") txt = "conveyor " + f1(state.speed) + " m/s · " + state.rate + " Hz · " + S7 + " · " + Math.floor(120 / gap) + " profiles on this 120 mm part" + (gap < 0.8 ? " · drawn every 0.8 mm" : "");
      else { const ok = samples.filter((s) => s.valid).length, lost = samples.filter((s) => s.lit && s.block).length; txt = lz + " · " + M.points + " points per profile" + (state.mode === "part" || state.mode === "pass" ? " · highest point under the line " + f1(Math.max(...samples.filter((s) => s.valid).map((s) => s.h), 0)) + " mm" + (lost ? " · no data on " + Math.round(lost / (ok + lost) * 100) + "% of the line" : "") : ""); }
      F.readout(txt);
    });

    // ---------- 10. views: what is solid, ghosted or hidden, and where the camera looks ----------
    const box = (a, b) => new THREE.Box3(new THREE.Vector3(...a), new THREE.Vector3(...b));
    const sensorBox = box([-36, -26, ZS - 2], [152, 26, ZS + 92]), apartBox = box([-40, -M.deep - 4, ZS - 4], [156, 28, ZS + 94]), triBox = box([-250, -72, B - 6], [152, 72, ZS + 92]);
    const INNER = ["c_diode", "c_line", "c_lwin", "c_cwin", "c_lens", "c_chip"], CONN = ["c_plan", "c_io"];
    function light(keys) { state.light = keys; for (const p of F.parts) { if (!p.isMesh || p.userData.tag === "flow" || p.userData.tag === "spec") continue; const on = keys.includes(p.userData.tag) || keys.includes(F.infoOf(p)); if (on || p.userData.lit2) { p.material.emissive.setHex(on ? 0x2f8cff : 0).multiplyScalar(0.5); p.userData.lit2 = on; } } }
    function show(v) {

      F.ghost("mount", g.mount); F.ghost("cable", g.cable); F.ghost("conv", g.conv); F.ghost("part", g.part); F.ghost("riser", g.riser); F.ghost("c_body", g.body); F.ghost("c_cover", g.cover); F.ghost(INNER, g.inner); F.ghost("c_board", g.board); F.ghost(CONN, g.conn); F.ghost("spec", g.spec); if (g.spec) F.ghost(meshes.trap, 0.3);

      state.view = v.view || null; state.mode = v.mode || "none"; state.beams = v.beams || {}; state.inset = v.inset || null; inset.style.display = v.inset ? "block" : "none"; state.demo = v.demo || null; state.hold = 0;
      state.build = v.build === undefined ? null : v.build; state.t0 = F.time;
      if (v.off !== undefined) state.off = v.off; state.stillOff = v.stillOff !== undefined ? v.stillOff : state.off; if (v.mode === "scan" || v.mode === "pass") { state.off = -100; scanReset(); }
      if (v.h !== undefined) state.h = v.h; if (v.speed) { state.speed = v.speed; state.rate = v.rate; }
      if (v.asm === "apart") M.comps.forEach((c, j) => F.to("c_" + c.key, j ? 1 : 0, 0.3)); else if (v.asm === "slider") applyAsm(); else if (state.build === null) M.comps.forEach((c) => F.to("c_" + c.key, 0, 0.3));
      light(v.light || []); F.flows(v.flow || null); F.labels(state.labels ? v.set : null); F.shadow(v.shadow === undefined ? 1 : v.shadow);
      F.focus(v.box, { azimuth: v.az, elevation: v.el, pad: v.pad || 1.05 });
      bar.querySelectorAll("[data-c]").forEach((e) => { e.hidden = e.dataset.c !== v.ctl; }); syncSliders(); F.run();
    }
    function applyAsm() { M.comps.forEach((c, j) => F.to("c_" + c.key, M.asm(state.asm, j), 0.1)); }
    const SEE = { body: 0.1, cover: 0.04, mount: 0.05, cable: 0.05 };
    const STAGES = [
      { name: "On the line", set: "line", hint: "The sensor hangs above the conveyor. It draws one laser line across each part that passes.", mode: "pass", stillOff: 26, beams: { fan: 1, line: 1 }, ghost: { part: 1 }, box: box([-330, -115, 0], [330, 175, ZS + 115]), az: 32, el: 18 },
      { name: "Outside", set: "out", hint: "From below: a sealed housing with two windows, one for the laser and one for the camera. Two connectors on the end.", ghost: { mount: 0.07, conv: 0, cable: 0.5 }, shadow: 0, box: sensorBox, az: 40, el: -20, pad: 1.3 },
      { name: "Inside", set: "in", hint: "The housing is see-through. Laser parts on the left, camera parts on the right, the processor board on top.", beams: { inner: 1, fan: 1 }, ghost: Object.assign({ conv: 0.05 }, SEE), box: sensorBox, az: 14, el: 10, pad: 1.2 },
      { name: "Apart", set: "apart", view: "apart", asm: "apart", hint: "Every component, moved out along one axis. From the housing forward, they are in the order of the light path.", ghost: { mount: 0, cable: 0, conv: 0 }, shadow: 0, box: apartBox, az: 56, el: 18 },
      { name: "Together", set: "apart", view: "asm", asm: "slider", ctl: "asm", hint: "Move the Assembly slider. The parts go in one at a time, in the order a builder fits them.", ghost: { mount: 0, cable: 0, conv: 0, body: 0.3 }, shadow: 0, box: apartBox, az: 56, el: 18 },
      { name: "Triangulation", set: "tri", ctl: "h", hint: "Move the Surface height slider. The laser comes straight down. The camera looks from the side, so a higher surface shifts the line on the chip.", mode: "flat", beams: { fan: 1, line: 1, rays: 1, inner: 1 }, inset: "row", ghost: Object.assign({ riser: 1, board: 0.12, conn: 0.2, conv: 0.5 }, SEE), box: triBox, az: 14, el: 8 },
      { name: "Spec sheet", set: "spec", view: "spec", hint: "The data sheet terms at full size: clearance distance, measurement range, and a field of view that is wider at the far end.", beams: {}, ghost: { spec: 1, mount: 0.05, cable: 0.05, conv: 0.35 }, box: box([-40, -80, B - 4], [150, 110, ZS + 92]), az: 66, el: 8 },
      { name: "Build a scan", set: "scan", ctl: "scan", hint: "The part moves through the laser plane. Each profile is one slice. After each pass the part fades, and the stacked slices stay as a 3D surface.", mode: "scan", stillOff: 24, beams: { fan: 1, line: 1 }, ghost: { part: 1, mount: 0.1, cable: 0.1 }, box: box([-115, -75, B - 8], [115, 75, B + 150]), az: 38, el: 30 },
    ];

    // ---------- 11. controls and lessons ----------
    const bar = document.createElement("div"); bar.className = "mech-controls";
    bar.innerHTML = STAGES.map((s, i) => `<button data-stage="${i}">${i + 1} ${s.name}</button>`).join("") + `<span class="sp"></span>` +
      `<span data-c="h">Surface height</span><input data-c="h" data-s="h" type="range" min="0" max="130" step="1" aria-label="Surface height in millimetres">` +
      `<span data-c="asm">Assembly</span><input data-c="asm" data-s="asm" type="range" min="0" max="100" step="1" aria-label="Assembly, 0 to 100">` +
      `<span data-c="scan">Conveyor speed</span><input data-c="scan" data-s="speed" type="range" min="0.2" max="3" step="0.1" aria-label="Conveyor speed in metres per second"><span data-c="scan">Scan rate</span><input data-c="scan" data-s="rate" type="range" min="0" max="100" step="1" aria-label="Scan rate">` +
      `<span class="sp"></span><button data-t="labels" aria-pressed="${state.labels}">Labels</button><button data-t="lesson">Lesson: one measurement</button><button data-t="build">Lesson: build it</button><button data-t="laser">${state.laser === "blue" ? "Red laser" : "Blue laser"}</button><button data-t="style">${REAL ? "Line view" : "Real view"}</button>`;

    const rateOf = (v) => { const r = 100 * Math.pow(90, v / 100); return r < 1000 ? Math.round(r / 10) * 10 : Math.round(r / 100) * 100; }, rateTo = (r) => Math.round(100 * Math.log(r / 100) / Math.log(90));

    const st = (i, extra) => () => { show(Object.assign({}, STAGES[i], { ctl: null }, extra)); bar.querySelectorAll("[data-stage]").forEach((b) => b.setAttribute("aria-pressed", "false")); };
    const pct = (v) => Math.round(v * 1000);
    const lesson = F.lesson([
      { title: "1. The laser makes a line", text: "The diode makes light, and a small lens makes the beam parallel. The line lens spreads the beam one way only. A flat fan of light leaves through the laser window. This fan is the laser plane.", go: st(2, { set: "laser", light: ["c_diode", "c_line", "c_lwin"], ghost: Object.assign({ conv: 0.3, board: 0.1, conn: 0.1 }, SEE), box: box([-45, -40, ZS - 60], [60, 40, ZS + 80]), az: 30, el: 12 }) },
      { title: "2. The line lands on the part", text: "The laser plane comes straight down and does not move. Where it meets the part, you see a bright line. The line follows the shape of the part: up on the pad, down on the base.", go: st(0, { mode: "part", off: 26, set: "line", box: box([-110, -80, B - 10], [150, 80, ZS + 95]), az: 34, el: 22 }) },

      { title: "5. The chip is tilted", text: "A lens can only keep one flat plane sharp. The laser plane is at an angle to the lens, so the chip is tilted to match. Now the near end and the far end are sharp at the same time. With a square chip, the line would blur over about " + Math.round(M.blurRows(M.zNear)) + " rows at the near end.", go: st(5, { h: 65, set: "optics", inset: null, light: ["c_chip"], ghost: Object.assign({ riser: 1, board: 0.05, conn: 0.1, conv: 0.5 }, SEE), box: box([40, -30, ZS + 10], [112, 30, ZS + 72]), az: 8, el: 6 }) },
      { title: "6. Find the line in every column", text: "The chip has 4192 pixel columns. In each one, the peak finder looks for the brightest row and refines it to a fraction of a pixel. Exposure matters here. A dark part gives a weak peak. A shiny part saturates the pixels and the top goes flat.", go: st(5, { h: 55, inset: "peak", light: ["fpga"], ghost: Object.assign({ riser: 1, board: 1, conn: 0.2, conv: 0.5 }, SEE) }) },
      { title: "7. Pixels become millimetres", text: "A calibration table turns each column and row into a real position: X along the line, Z for height. The same 4192 points cover 71 mm at the near end and 135 mm at the far end. So the points are " + f1(M.fovNear / M.points * 1000) + " µm apart near the sensor and " + f1(M.fovFar / M.points * 1000) + " µm apart far from it.", go: st(6, { light: ["cal"] }) },
      { title: "8. Profile, tool, result", text: "The calibrated points make one profile. The processor runs a measurement tool on it, for example a height or a gap, and compares the result with the limits. The pass or fail signal leaves on the I/O connector. All of this happens in the head.", go: st(2, { set: "chain", flow: "chain", light: ["cpu", "c_io"], beams: { inner: 1, fan: 1, line: 1 }, ghost: Object.assign({ conv: 0.4 }, SEE), box: box([-60, -60, B - 6], [160, 60, ZS + 92]), az: 14, el: 8 }) },
      { title: "9. What if a tall edge blocks the camera?", text: "The laser still lights the surface behind the tall rib. But the rib stands between that spot and the camera. The orange rays stop at the rib, and that part of the line has no data. This is occlusion. A bigger camera angle gives better height resolution and longer blind zones.", go: st(5, { mode: "part", off: -5, set: "occ", inset: "row", ghost: Object.assign({ part: 1, board: 0.12, conn: 0.2, conv: 0.5 }, SEE), box: box([-70, -70, B - 6], [60, 70, B + 135]), az: -72, el: 24 }) },
      { title: "10. What if the conveyor is fast and the scan rate is low?", text: "The sensor takes one profile each time it scans. Distance between profiles = speed / scan rate. At 2.5 m/s and 150 Hz that is " + f1(M.spacing(2.5, 150)) + " mm, so small features fall between the slices. At 9000 Hz it is " + f2(M.spacing(2.5, 9000)) + " mm.", go: st(7, { speed: 2.5, rate: 150, stillOff: 70 }) },
      { title: "11. Back on the line", text: "One line, one camera at an angle, one chip, and a computer in the head. Each scan gives one profile. The moving part gives the third dimension.", go: st(0) },
    ], { onClose: () => setStage(0, true) });
    const BT = {
      body: "It holds every other part at a fixed distance and angle. Nothing comes before it. It gives the optics a rigid frame, and the windows and connectors a sealed seat.",
      diode: "It turns current into laser light and makes the beam parallel. It needs drive current from the processor board. It gives a narrow, parallel beam to the line lens.",
      line: "It spreads the beam in one direction only. It needs a parallel beam from the diode module. It gives a flat fan of light, the laser plane, to the laser window.",
      lwin: "It lets the laser plane out and keeps dust and water out. It needs the fan from the line lens. It gives the part a bright laser line.",
      cwin: "It lets the scattered light come back in. It needs the lit line on the part. It gives that light to the camera lens.",
      lens: "It collects the light and forms an image of the line. It needs a clear view through the camera window. It gives a sharp image to the image chip.",
      chip: "It turns the image into numbers, one brightness value for each pixel. It needs a sharp image, so it sits tilted behind the lens. It gives frames of pixels to the processor board.",
      board: "It finds the line in every column, converts pixels to millimetres and runs the measurement. It needs pixel frames from the chip, and it drives the laser. It gives a profile and a result to the connectors.",
      plan: "It brings in power and the laser safety signal, and it carries Ethernet. It needs the processor board behind it. It gives the board power, and it gives you the setup pages and the 3D data.",
      io: "It carries the trigger or encoder in, and the result out. It needs a decision from the processor board. It gives the production line a pass or fail signal.",
      cover: "It closes the housing and presses on the seal. It needs every part in place first. It gives a sealed unit that keeps its alignment.",
    };
    const buildView = (j) => ({ view: "build", build: j, set: null, ghost: { mount: 0, cable: 0, conv: 0, body: 0.3 }, shadow: 0, box: apartBox, az: 56, el: 18 });
    const buildLesson = F.lesson(M.comps.map((c, j) => ({ title: (j + 1) + ". " + c.name, text: BT[c.key], go: () => { const gk = {}; M.comps.forEach((o, k) => { if (k > j) gk[o.key] = 0.12; else if (o.key !== "body") gk[o.key] = 1; }); if (!j) gk.body = 1; show(Object.assign(buildView(j), { ghostKeys: gk, light: c.links.map((k) => "c_" + k), box: box([-40, -Math.max(c.d + 40, 170), ZS - 4], [156, 28, ZS + 94]) })); } })).concat([
      { title: "12. Laser on: the first profile", text: "All eleven parts are in place. The board fires the laser, the line lands on the part, the lens images it on the chip, and the board turns it into a profile. No single part measures anything. The system does.", go: st(5, { mode: "part", off: 26, build: M.comps.length, set: null, inset: "row", light: [], ghost: Object.assign({ part: 1, board: 0.5, conn: 0.6, conv: 0.5 }, SEE), box: box([-70, -75, B - 6], [152, 75, ZS + 92]), az: 28, el: 14 }) },
    ]), { onClose: () => setStage(4, true) });
    F.label("part", { set: "occ", text: "Tall rib", on: [11, 20, B + 75] }); F.label("nodata", { set: "occ", text: "Lit, but no data", on: [-1, 28, B + 13] }); F.label("seen", { set: "occ", text: "Line the camera sees", on: [-1, -40, B + 13] }); F.label("blocked", { set: "occ", text: "Blocked camera rays", on: [4, 30, B + 26] });
    for (const k of ["diode", "line", "lwin"]) F.label(k, { set: "laser" }); F.label("collimator", { set: "laser" });
    F.label("lens", { set: "optics" }); F.label("chip", { set: "optics", text: "Tilted image chip" }); F.label("flex", { set: "optics" });
    bar.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; F.touch(); const t = b.dataset.t;
      if (b.dataset.stage) setStage(+b.dataset.stage); else if (t === "style") { state.style = REAL ? "line" : "real"; start(); } else if (t === "laser") { state.laser = state.laser === "blue" ? "red" : "blue"; start(); }
      else if (t === "labels") { state.labels = !state.labels; b.setAttribute("aria-pressed", state.labels); setStage(state.stage, true); } else if (t === "lesson") lesson.open(0); else if (t === "build") buildLesson.open(0); });
    F.stage.addEventListener("keydown", (e) => { if (e.key >= "1" && e.key <= String(STAGES.length)) setStage(+e.key - 1); });
    F.onPress = () => setStage(state.stage + 1);
    F.tour(() => setStage(state.stage + 1, true));

    // ---------- 12. card: every simplification is in the caption ----------
    mech.card("#fig", {
      fig: "Fig 6", title: "How a laser line profiler measures height",
      keys: [{ mark: "lit", label: "Click a part to learn what it does" }, { mark: "mid", label: "Keys 1 to 8 change the view. Drag to orbit. Sources lists every number." }],
      caption: "Reference model: Gocator 2630. The clearance distance, the measurement range, the field of view, the 4192 points and the scan rate come from the data sheet. The height in the readout comes back from the row of the line on the chip, through the same lens geometry that draws the rays. Assumed or illustrative: the housing is a generic shape, not the product design. The internal layout, the " + Math.round(M.angle / D) + " degree camera angle, the lens and the chip size are not published. They are chosen so that the model gives the published field of view. Height 0 is the conveyor, placed at the far end of the range. The motion is slowed down. When profiles are closer than 0.8 mm, the figure draws one every 0.8 mm. Dots show the order of the signal chain, not its speed. That the measurement tools run in the head is the usual description of a smart sensor. It is marked assumed in Sources. " + (state.laser === "blue" ? "Blue" : "Red") + " laser shown: blue gives less speckle and finer detail, red is the general-purpose choice and does not make plastics glow.",
    });
    window.fig = F; window.setStage = setStage; window.state = state; window.buildLesson = buildLesson; window.model = M;
    window.verify = () => { const r = {}; M.comps.forEach((c) => { const g = G[c.key]; r[c.key] = +(g.position.distanceTo(g.userData.rest)).toFixed(4); }); return r; };
    setStage(state.stage, true); F.fit(true);
  }
  addEventListener("mech-theme", start);
  start();
})();
